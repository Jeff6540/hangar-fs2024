<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMS — Hangar FS 2024</title>
<link rel="icon" type="image/png" href="/favicon.png">
<!--HANGAR_USER-->
<style>
:root{--bg:#15181e;--dev:#1b1d22;--scr:#0b0d10;--line:#2a2d33;--sky:#38BDF8;--skyt:#7fd3ff;--txt:#cfe6f5;--mut:#9aa3ad;--act:#e05bd8;--actt:#f2a7ee;--ok:#7fe0a8;--warn:#f2c46b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px "Segoe UI Variable Text","Segoe UI",Inter,sans-serif}
body{display:flex;flex-direction:column;padding:10px;gap:8px}
.mono{font-family:Consolas,"Cascadia Mono",monospace}
.bar{display:flex;align-items:center;justify-content:space-between;background:var(--scr);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.route{font-size:18px;color:var(--skyt);letter-spacing:.5px}
.route small{font-size:12px;color:var(--mut)}
.sub{font-size:12px;color:var(--mut)}
.list{flex:1;min-height:120px;overflow:auto;background:var(--scr);border:1px solid var(--line);border-radius:8px}
.row{display:grid;grid-template-columns:1.5fr .8fr .8fr .9fr;padding:7px 10px;border-left:3px solid transparent;cursor:pointer}
.row:hover{background:#121821}
.row.head{position:sticky;top:0;background:#0f1318;color:#8fb8d6;font-size:11px;cursor:default;border-bottom:1px solid var(--line)}
.row.done{color:#6fcf97}
.row.done span:first-child::before{content:'✓ ';color:#4f9a6e}
.row.on{background:#2a1430;border-left-color:var(--act);color:var(--actt)}
.row .via{display:block;font-size:10.5px;color:var(--mut)}
.row.tod{color:var(--warn);cursor:default;background:#1d1a12}
.altc .unk{color:var(--warn);font-weight:700}
.altc .def{color:var(--mut);margin-left:2px}
.altc{cursor:text;border-bottom:1px dashed transparent} .altc:hover{border-bottom-color:var(--skyt)} .altc i{font-style:normal;color:#5d6670}
#cruise{cursor:text;padding:2px 6px;border:1px dashed #3a3d44;border-radius:6px} #cruise:hover{border-color:var(--skyt)}
.ed{width:74px;text-align:center;font:inherit;color:var(--skyt);background:#11161c;border:1px solid var(--skyt);border-radius:5px;padding:1px}
.row.tod .live{color:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--mut);line-height:1.6}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tiles .wide{grid-column:span 2}
.panel{flex:1;min-height:120px;overflow:auto;background:var(--scr);border:1px solid var(--line);border-radius:8px;padding:10px;display:none}
.panel.on{display:block}
.panel h4{margin:0 0 8px;font-size:13px;color:var(--skyt);display:flex;justify-content:space-between;align-items:center}
.panel h4 button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:3px 8px;cursor:pointer;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:#11161c;border:1px solid #3a3d44;border-radius:7px;padding:6px 10px;color:var(--txt);font:600 12px Consolas,monospace;cursor:pointer}
.chip:hover{border-color:var(--skyt)} .chip.sel{background:#16324a;border-color:var(--skyt);color:#fff}
.chip.ils{border-color:#4f9a6e}
.panel .hint{font-size:12px;color:var(--mut);line-height:1.5}
.ilsl{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--scr);border:1px solid #2f5a44;border-radius:8px;padding:6px 10px;font-size:12px;color:#d4f2df}
.ilsl small{display:block;color:var(--mut);font-size:11px}
#apIlsTxt{flex:1;min-width:0}
.ilsl button{flex:none;background:#1d3b2b;border:1px solid #4f9a6e;color:#d4f2df;border-radius:6px;padding:5px 8px;font-family:inherit;font-weight:600;font-size:11px;cursor:pointer}
.ilsl button.off{background:#11161c;border-color:#3a3d44;color:var(--mut)}
.tile{background:#16324a;border:1px solid #3d7aa6;border-radius:9px;padding:9px 4px;text-align:center;color:var(--txt);font-family:inherit;font-weight:600;font-size:12px;cursor:pointer}
.tile:hover{border-color:var(--skyt);color:#fff}
.tile svg{display:block;margin:0 auto 3px;width:18px;height:18px;stroke:currentColor}
.tile.warn{background:#3a2a14;border-color:#a8792f}
.mem{font-size:11px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.mem b{color:var(--ok);font-weight:600}
#msg{min-height:16px;font-size:12px;color:var(--warn)}
.scr{flex:1;min-height:0;display:none;flex-direction:column;gap:8px;overflow:auto}
.scr.on{display:flex}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chsel{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chsel button{background:#11161c;border:1px solid #3a3d44;border-radius:8px;padding:7px 4px;color:var(--mut);font:600 12.5px "Segoe UI",Inter,sans-serif;cursor:pointer}
.chsel button.on{background:#1f4a6b;border-color:var(--skyt);color:#fff}
.chtitle{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#d4e6f5}
.chtitle small{display:block;color:var(--mut);font-size:11px}
.chtitle > span:last-child{flex:none;white-space:nowrap}
.chtitle button{flex:none;background:#16324a;border:1px solid #3d7aa6;color:#e6f5ff;border-radius:6px;padding:5px 8px;font:600 11px inherit;cursor:pointer}
#chart{width:100%;aspect-ratio:1/1;background:#0b1118;border:1px solid var(--line);border-radius:8px;display:block}
.chnote{font-size:11px;color:var(--mut);line-height:1.4}
.nav .tile.on{background:#1f4a6b;border-color:var(--skyt);color:#fff}
.apst{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--scr);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px}
.apst .ac{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apst .st{flex:none;color:var(--mut)} .apst .st.ok{color:var(--ok)} .apst .st.bad{color:var(--warn)}
.note{font-size:11.5px;color:var(--warn);line-height:1.45}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.md{background:#11161c;border:1px solid #3a3d44;border-radius:8px;padding:8px 2px;text-align:center;color:var(--mut);font:600 13px "Segoe UI",Inter,sans-serif;cursor:pointer}
.md small{display:block;font-size:10.5px;font-weight:500;margin-top:2px}
.md:hover{border-color:#5b6470}
.md.on{background:#1d3b2b;border-color:#4f9a6e;color:#d4f2df}
.md.on small{color:var(--ok)}
.md.busy{border-style:dashed;border-color:var(--skyt)}
.md.no{opacity:.55} .md.no small{color:var(--warn)}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:70px 44px 1fr 44px;align-items:center;gap:6px;background:var(--scr);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.set .lb{color:#8fb8d6;font-size:12px}
.set .lb small{display:block;color:var(--mut);font-size:10.5px;font-family:Consolas,monospace}
.set button{height:36px;border-radius:7px;border:1px solid #3d7aa6;background:#16324a;color:#fff;font-family:inherit;font-weight:600;font-size:18px;cursor:pointer;user-select:none;touch-action:none}
.set button:hover{border-color:var(--skyt)}
.set .val{text-align:center;font:600 20px Consolas,"Cascadia Mono",monospace;color:var(--skyt);cursor:text}
.set .val input{width:100%;text-align:center;font:inherit;color:inherit;background:#11161c;border:1px solid var(--skyt);border-radius:6px;padding:2px}
.set.off .val{color:#5d6670}
.legend{font-size:11px;color:var(--mut)}
.modes.pm .md.on{background:#3a3214;border-color:#c9a227;color:#ffe9a8} .modes.pm .md.on small{color:#ffd65c}
.modes.pm .md.cmd.on{background:#1d3b2b;border-color:#4f9a6e;color:#d4f2df} .modes.pm .md.cmd.on small{color:var(--ok)}
.md.fms{background:#16324a;border-color:var(--skyt);color:#e6f5ff} .md.fms small{color:var(--warn)}
.lnavl{min-height:16px;font-size:12px;color:var(--actt)} .lnavl.msg{color:var(--warn);font-family:inherit}
</style>
</head>
<body>
<div class="bar">
  <div>
    <div class="route mono" id="route">---- <small>→</small> ----</div>
    <div class="sub" id="info"></div>
  </div>
  <div class="sub mono" id="cruise"></div>
</div>

<div class="scr" id="scrPlan">
<div class="list" id="list"></div>
<div class="panel" id="apprPanel"></div>

<div id="msg"></div>
<div class="tiles">
  <button class="tile" id="bSimbrief"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span data-t="simbrief"></span></button>
  <button class="tile" id="bPln"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14h6M9 17h4"/></svg><span data-t="pln"></span></button>
  <input type="file" id="plnFile" accept=".pln,.PLN,.xml" style="display:none">
  <button class="tile" id="bDirect"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M13 9l3 3-3 3"/></svg><span data-t="direct"></span></button>
  <button class="tile" id="bAppr"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h18"/><path d="M5 18l7-12 7 12"/><path d="M12 6v12"/></svg><span data-t="appr"></span></button>
  <button class="tile" id="bSend"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16l20-6-20-6 4 6z"/><path d="M6 10h7"/></svg><span data-t="send"></span></button>
  <button class="tile warn" id="bNew"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg><span data-t="newflight"></span></button>
</div>
</div>

<div class="scr" id="scrAp">
  <div class="apst"><span class="ac" id="apAc"></span><span class="st" id="apSt"></span></div>
  <div class="note" id="apNote"></div>
  <div id="pmPanel" style="display:none">
    <div class="note" id="pmNote"></div>
    <button class="chip" id="pmSdk" style="display:none;margin:6px 0">Activer le SDK PMDG</button>
    <div class="modes pm" id="pmModes"></div>
    <div class="sets" id="pmSets" style="margin-top:6px"></div>
  </div>
  <div class="modes" id="apModes"></div>
  <div class="lnavl mono" id="apLnav"></div>
  <div class="lnavl mono" id="apVnav"></div>
  <div class="ilsl" id="apIls" style="display:none"><span id="apIlsTxt"></span><button id="apIlsAuto"></button><button id="apIlsArm"></button></div>
  <div class="ilsl" id="apCom" style="display:none"><span id="apComTxt"></span><button id="apComAuto"></button></div>
  <div class="sets" id="apSets"></div>
  <div class="legend" data-t="apLegendL"></div>
  <div class="legend" data-t="apLegend"></div>
</div>

<div class="scr" id="scrChart">
  <div class="chsel"><button id="chDep"></button><button id="chArr"></button></div>
  <div class="chtitle"><span id="chTitle"></span><span><button id="chNg"></button> <button id="chSia" style="display:none"></button></span></div>
  <svg id="chart" viewBox="0 0 480 480"></svg>
  <div class="chnote" data-t="chNote"></div>
</div>

<div class="nav">
  <button class="tile" data-scr="Plan"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-t="navPlan"></span></button>
  <button class="tile" data-scr="Ap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M12 3v7M5 16l5.5-3M19 16l-5.5-3"/></svg><span data-t="navAp"></span></button>
  <button class="tile" data-scr="Chart"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span data-t="navChart"></span></button>
</div>
<div class="mem"><span id="mem"></span><span id="src"></span></div>

  };
  function t(k, v) { var s = (T[k] || [k, k])[LANG === 'en' ? 1 : 0]; Object.keys(v || {}).forEach(function (x) { s = s.replace('{' + x + '}', v[x]); }); return s; }
  function $(id) { return document.getElementById(id); }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function msg(s) { $('msg').textContent = s || ''; }

  // ---- calculs de navigation
  var R = Math.PI / 180;
  function distNm(a, b) {
    var dLat = (b.lat - a.lat) * R, dLon = (b.lon - a.lon) * R;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * R) * Math.cos(b.lat * R) * Math.sin(dLon / 2) * Math.sin(dLon / 2);

  }
  function bearing(a, b) {

    return (Math.atan2(y, x) / R + 360) % 360;
  }
  function ok(p) { return p && isFinite(p.lat) && isFinite(p.lon); }

  // ---- affichage
  var directMode = false;
  function render(st) {
    var p = (st && st.plan) || {}, route = p.route || [], act = p.activeLeg || 0;
    var o = (p.origin && p.origin.icao) || '----', d = (p.dest && p.dest.icao) || '----';
    $('route').innerHTML = esc(o) + ' <small>→</small> ' + esc(d);
    var bits = [];
    if (p.origin && p.origin.rwy) bits.push(esc(o) + ' ' + esc(p.origin.rwy));
    if (p.departure) bits.push(t('sid') + ' ' + esc(p.departure));
    if (p.arrival) bits.push(t('star') + ' ' + esc(p.arrival));
    if (p.approach) bits.push(esc(p.approach));
    if (p.dest && p.dest.rwy) bits.push(esc(d) + ' ' + esc(p.dest.rwy));
    $('info').innerHTML = bits.join(' · ');
    if (!$('cruise').querySelector('input')) $('cruise').textContent = p.cruiseAlt ? (p.cruiseAlt >= 10000 ? 'FL' + String(Math.round(p.cruiseAlt / 100)).padStart(3, '0') : Math.round(p.cruiseAlt) + ' ft') : t('setCruise');

    if (!route.length) { $('list').innerHTML = '<div class="empty">' + t('empty') + '</div>'; }
    else {
      var h = '<div class="row head"><span>' + t('point') + '</span><span>' + t('dtk') + '</span><span>' + t('dist') + '</span><span>' + t('alt') + '</span></div>', total = 0;
      var todp = planTod(p), todDone = false;
      route.forEach(function (w, i) {
        // point T/D (début de descente) inséré à sa place dans la liste
        if (todp && !todDone && i === todp.leg) {
          todDone = true;
          h += '<div class="row mono tod" id="todRow"><span>▼ T/D<span class="via">' + t('todVia', { a: Math.round(todp.alt), p: esc(todp.to) }) + (todp.steep ? ' · ' + t('todSteep') : '') + '</span></span><span></span><span>' + todp.fromPrev.toFixed(1) + '</span><span>' + Math.round(todp.from) + '</span></div>';
        }
        var prev = route[i - 1], dd = '', tk = '';
        if (prev && ok(prev) && ok(w)) { var nm = distNm(prev, w); total += nm; dd = nm.toFixed(1); tk = String(Math.round(bearing(prev, w)) || 360).padStart(3, '0') + '°'; }
        var cls = i === act ? ' on' : i < act ? ' done' : '';
        h += '<div class="row mono' + cls + '" data-i="' + i + '"><span>' + (i === act ? '▶ ' : '') + esc(w.ident) + (w.via || w.faf ? '<span class="via">' + esc(w.via || '') + (w.faf ? ' · FAF' : '') + '</span>' : '') + '</span><span>' + tk + '</span><span>' + dd + '</span><span>' + '<span class="altc" data-alt="' + i + '">' + ((i === 0 || i === route.length - 1) ? (elevOk(w) ? Math.round(w.alt || 0) : '<i class="unk">?</i>') : (w.alt ? Math.round(w.alt) + (w.altDef ? '<i class="def">*</i>' : w.altDesc === 2 ? '<i class="def">A</i>' : w.altDesc === 3 ? '<i class="def">B</i>' : w.altDesc === 4 ? '<i class="def">±</i>' : '') : '<i>+</i>')) + '</span></span></div>';
      });
      $('list').innerHTML = h;
      todLive();
      $('info').innerHTML += (bits.length ? ' · ' : '') + t('total', { n: route.length, d: Math.round(total) });
      if (route.some(function (w) { return w.altDef; }) && !$('msg').textContent) msg(t('defNote'));
      var dW = route[route.length - 1];

      if (!p.cruiseAlt && !route.some(function (w, j) { return j > 0 && j < route.length - 1 && w.alt; }) && !$('msg').textContent) msg(t('altHint'));

    }
    var when = st && st.updated ? new Date(st.updated).toLocaleTimeString(LANG === 'en' ? 'en-GB' : 'fr-FR', { hour: '2-digit', minute: '2-digit' }) : '--:--';
    $('mem').innerHTML = t('mem', { r: (st && st.rev) || 0, t: when }) + ' · <b>' + t('memOk') + '</b>';
    var s = st && st.source ? (T.src[st.source] ? T.src[st.source][LANG === 'en' ? 1 : 0] : st.source) : '';
    $('src').textContent = s ? t('by', { s: s }) : '';
  }
  FmsStore.onChange(render);
  FmsStore.onChange(function () { if ($('scrChart').classList.contains('on')) drawChart(); });

  // ---- Approche : liste des approches de la destination (données de navigation de MSFS importées par la page Plan VFR)
  var appr = { list: null, sel: -1 };
  function closeAppr() { $('apprPanel').classList.remove('on'); $('list').style.display = ''; }
  $('bAppr').onclick = function () {
    var p = (FmsStore.state && FmsStore.state.plan) || {}, icao = p.dest && p.dest.icao, pnl = $('apprPanel');
    if ($('apprPanel').classList.contains('on')) { closeAppr(); return; }
    $('list').style.display = 'none'; pnl.classList.add('on');
    var head = '<h4><span>' + t('apprAt', { a: esc(icao || '----') }) + '</span><button data-a="close">' + t('close') + '</button></h4>';
    if (!icao || !(p.route || []).length) { pnl.innerHTML = head + '<div class="hint">' + t('apprNoDest') + '</div>'; return; }
    pnl.innerHTML = head + '<div class="hint">…</div>';
    fetch('/approaches?icao=' + encodeURIComponent(icao)).then(function (r) { return r.json(); }).catch(function () { return []; }).then(function (list) {
      appr.list = Array.isArray(list) ? list : []; appr.sel = -1; appr.icao = icao; drawAppr(head);
    });
  };
  // branche d'approche des données MSFS : [point, lat, lon, type, contrainte, alt1 ft, alt2 ft, angle, 1 IAF + 2 IF + 4 FAF]
  function legPoint(l, name) {
    var w = { ident: l[0], lat: +l[1], lon: +l[2], alt: 0, type: 'wpt', via: name, ap: true };
    if (l.length >= 9) {
      var d = +l[4] || 0, a1 = +l[5] || 0, a2 = +l[6] || 0;
      if (d > 0 && a1 > 0) { w.alt = Math.round(d === 4 ? Math.max(a1, a2) : a1); w.altDesc = d; w.altSrc = 'msfs'; }
      if (+l[8] & 4) w.faf = true;
      if (+l[8] & 1) w.iaf = true;
      if (+l[7]) w.vang = +l[7];
    }
    return w;
  }
  function apprName(a) { return (a.t || '?') + ' ' + (a.r || '') + (a.s ? ' ' + a.s : ''); }
  function drawAppr(head) {
    var pnl = $('apprPanel'), L = appr.list;
    head = head || pnl.querySelector('h4').outerHTML;
    if (!L.length) { pnl.innerHTML = head + '<div class="hint">' + t('apprNone', { a: esc(appr.icao) }) + '</div>'; return; }
    var h = head + '<div class="chips">' + L.map(function (a, i) {
      return '<button class="chip' + (/^(ILS|LOC|LDA|SDF)/.test(a.t) ? ' ils' : '') + (i === appr.sel ? ' sel' : '') + '" data-a="ap" data-i="' + i + '">' + esc(apprName(a)) + '</button>';
    }).join('') + '</div>';
    if (appr.sel >= 0) {
      var a = L[appr.sel];
      h += '<div class="hint">' + t('apprPickTr') + '</div><div class="chips"><button class="chip" data-a="tr" data-i="-1">' + t('apprVectors') + '</button>' +
        (a.tr || []).map(function (tr, i) { var l = tr.l || []; return l.length ? '<button class="chip" data-a="tr" data-i="' + i + '">' + esc(l[0][0]) + '</button>' : ''; }).join('') + '</div>';
    }
    pnl.innerHTML = h;
  }
  $('apprPanel').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-a]'); if (!b) return;
    if (b.dataset.a === 'close') { closeAppr(); return; }
    if (b.dataset.a === 'ap') { appr.sel = +b.dataset.i; drawAppr(); return; }
    if (b.dataset.a === 'tr') applyAppr(appr.list[appr.sel], +b.dataset.i);
  });
  function findIls(a, dest) {   // ILS de la piste : près de la destination, axe proche du numéro de piste
    return new Promise(function (res) {
      if (!/^(ILS|LOC|LDA|SDF)/.test(a.t) || !ok(dest)) { res(null); return; }
      var q = '&s=' + (dest.lat - .25) + '&w=' + (dest.lon - .35) + '&n=' + (dest.lat + .25) + '&e=' + (dest.lon + .35);
      fetch('/nav?k=ils' + q).then(function (r) { return r.json(); }).catch(function () { return []; }).then(function (arr) {
        var rh = (parseInt(a.r, 10) || 0) * 10, best = null;
        (arr || []).forEach(function (r) {
          var loc = +r[7] || 0, mv = +r[4] || 0;
          // axe magnétique = axe vrai − déclinaison ; on garde le premier calcul qui tombe près du numéro de piste
          var cs = [loc - mv, loc, loc + mv].filter(function (c) { return Math.abs(((c - rh) % 360 + 540) % 360 - 180) < 30; });
          if (!rh || !cs.length) return;
          var c = cs[0], d = Math.abs(((loc - rh) % 360 + 540) % 360 - 180);

        });
        res(best ? { ident: best.ident, freq: best.freq, crs: best.crs, gs: a.t === 'ILS', type: a.t } : null);
      });
    });
  }
  function applyAppr(a, tri) {
    var st = FmsStore.state || {}, p = st.plan || {}, route = (p.route || []).filter(function (w) { return !w.ap; });
    if (route.length < 2) return;
    var dest = route[route.length - 1], body = route.slice(0, -1), name = apprName(a);
    var legs = (tri >= 0 && a.tr && a.tr[tri] ? a.tr[tri].l || [] : []).concat(a.f || []);
    var pts = [], oldData = legs.length && legs.every(function (l) { return !l || l.length < 5; });
    legs.forEach(function (l) {
      if (!l || !l[0]) return;
      var w = legPoint(l, name);
      if (pts.length && pts[pts.length - 1].ident === l[0]) { if (w.alt) pts[pts.length - 1] = w; return; }   // même point : on garde celui qui a l'altitude
      pts.push(w);
    });
    appr.oldData = oldData;
    if (!pts.length) return;
    var k = -1; body.forEach(function (w, i) { if (w.ident === pts[0].ident && i > 0) k = i; });   // point d'entrée déjà dans la route : on raccorde là
    if (k > 0) {   // point de raccord : altitude prévue gardée, mais dans le respect de la contrainte de l'approche
      var pa = body[k].alt || 0, w0 = pts[0];

      else if (pa && w0.altDesc === 2) w0.alt = Math.max(pa, w0.alt);
      else if (pa && w0.altDesc === 3) w0.alt = Math.min(pa, w0.alt);
      body = body.slice(0, k);

    var nr = body.concat(pts, [dest]);
    var curId = route[p.activeLeg || 1] ? route[p.activeLeg || 1].ident : '', act = -1;
    nr.forEach(function (w, i) { if (act < 0 && i > 0 && w.ident === curId) act = i; });
    if (act < 1) act = Math.min(p.activeLeg || 1, nr.length - 1);
    approachAlts(nr, false);

      FmsStore.set({ plan: { route: nr, activeLeg: act, approach: name, dest: { rwy: a.r || '' }, ils: ils } }, 'fms');
      closeAppr(); render.scrolled = false;
      msg((appr.oldData ? t('apprOld') + ' ' : '') + t('apprOk', { n: name, i: ils ? t('apprIls', { id: ils.ident, f: (ils.freq / 1e6).toFixed(2), c: String(ils.crs).padStart(3, '0') }) : (/^(ILS|LOC)/.test(a.t) ? t('apprNoIls') : '') }));
    });
  }

  // Approche : seuil de piste sans altitude ; plan d'approche finale (FAF) à 3000 ft par défaut (ou terrain + 1500 ft si plus haut),
  // et les points de l'approche avant le FAF au même niveau (palier avant de capter le plan de descente). fromFile : on remplace les
  // altitudes venues d'un fichier ; sinon on ne remplit que les altitudes vides (celles tapées à la main sont gardées).
  function approachAlts(route, fromFile) {
    var last = route.length - 1, rwI = -1, i;
    for (i = 1; i <= last; i++) if (/^RW\d/.test(route[i].ident || '')) { route[i].alt = 0; if (rwI < 0) rwI = i; }
    var apIdx = []; for (i = 1; i < last; i++) if (route[i].ap && !/^RW\d/.test(route[i].ident || '')) apIdx.push(i);
    if (!apIdx.length) return;
    if (apIdx.some(function (k) { return route[k].altSrc === 'msfs'; })) return;   // vraies altitudes des données MSFS : rien à inventer
    var end = rwI > 0 ? rwI : last, faf = -1;
    apIdx.forEach(function (k) { if (k < end && (route[k].faf || /^(FF|FI|FA|FAF)/.test(route[k].ident))) faf = k; });
    if (faf < 0) apIdx.forEach(function (k) { if (k < end) faf = k; });
    if (faf < 0) return;
    var elev = elevOk(route[last]) ? route[last].alt || 0 : 0, def = Math.max(3000, Math.ceil((elev + 1500) / 100) * 100);
    if (fromFile || !route[faf].alt) { route[faf].alt = def; route[faf].altDef = true; }
    var fa = route[faf].alt;
    apIdx.forEach(function (k) { if (k < faf && (fromFile || !route[k].alt || route[k].altDef)) { route[k].alt = fa; route[k].altDef = true; } });
  }

  // altitude du terrain connue ? (venue de SimBrief, du .PLN, de la base d'aéroports ou tapée à la main)
  function elevOk(w) { return !!w && (w.elev === true || (w.alt > 0 && w.elev !== false)); }

  // ---- Envoyer à l'avion : MSFS (plan actif), GTN PMS50 (fpl.pln), GTN TDS (.gfp)
  var lastFile = '';
  $('apprPanel').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-a="dir"]'); if (b) fetch('/fms-folder?f=' + encodeURIComponent(lastFile), { cache: 'no-store' });
  });
  $('bSend').onclick = function () {
    var pnl = $('apprPanel'), head = '<h4><span>' + t('sendAt') + '</span><button data-a="close">' + t('close') + '</button></h4>';
    $('list').style.display = 'none'; pnl.classList.add('on'); pnl.innerHTML = head + '<div class="hint">' + t('sending') + '</div>';
    fetch('/fms-export', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.error) { pnl.innerHTML = head + '<div class="hint">' + esc(j.error) + '</div>'; return; }
      var L2 = [], gtn = false;
      (j.targets || []).forEach(function (x) {
        if (x.id === 'msfs') {
          var fn = (j.file || '').split(/[\\/]/).pop();
          L2.push(j.file ? t('sdEfb', { f: esc(fn) }) + '<br><button class="chip" data-a="dir" style="margin-top:6px">' + t('openDir') + '</button>' : t('sdFail', { t: 'MSFS', w: esc(x.why) }));
          lastFile = j.efb || j.file || '';
        }
        else if (x.id === 'pms50') { gtn = true; L2.push(x.ok ? t('sdPms', { m: esc(x.model) }) : t('sdFail', { t: esc(x.model) + ' PMS50', w: esc(x.why) })); }
        else if (x.id === 'tds') { gtn = true; L2.push(x.ok ? t('sdTds', { f: esc(x.file) }) : t('sdFail', { t: 'GTN TDS', w: esc(x.why) })); }
      });
      if (!gtn) L2.push(t('sdNone'));
      pnl.innerHTML = head + L2.map(function (l) { return '<div class="hint" style="margin-bottom:8px">' + l + '</div>'; }).join('') + '<div class="hint" style="color:var(--warn)">' + t('sdNote') + '</div>';
    }).catch(function () { pnl.innerHTML = head + '<div class="hint">' + t('sendErr') + '</div>'; });
  };

  function hasFaf(route) { return route.some(function (w) { return w.ap && w.alt > 0; }); }

  // ---- T/D prévu : même calcul que le VNAV (pente 3°, après le point le plus haut ; destination : terrain + 1500 ft, 5 NM avant)
  function planTod(p) {
    var route = p.route || []; if (route.length < 3) return null;
    var cum = [0];
    for (var i = 1; i < route.length; i++) cum[i] = cum[i - 1] + (ok(route[i - 1]) && ok(route[i]) ? distNm(route[i - 1], route[i]) : 0);
    var top = 0;
    for (i = 1; i < route.length - 1; i++) if ((route[i].alt || 0) > top) top = route[i].alt;

  function pmVal(k) { if (pmLocal[k] != null && Date.now() - pmAt[k] < 2500) return pmLocal[k]; var pm = mcp(); return pm && pm[k] != null ? pm[k] : null; }
  function pmSet(k, v) {
    var x = PM_SET.filter(function (q) { return q[0] === k; })[0];
    if (k === 'hdg' || k === 'crs') { v = Math.round(v) % 360; if (v <= 0) v += 360; }
    else if (!(k === 'ias' && v < 1)) v = Math.max(x[4], Math.min(x[5], Math.round(v)));
    pmLocal[k] = v; pmAt[k] = Date.now(); drawPm();
    try { window.chrome.webview.postMessage({ ap: { c: mcpKind() + '_set', k: k, v: v } }); } catch (e) {}
  }
  var pmHold = null;
  $('pmSets').addEventListener('pointerdown', function (e) {
    var b = e.target.closest('button[data-d]'); if (!b) return;
    var k = b.closest('.set').dataset.ps, x = PM_SET.filter(function (q) { return q[0] === k; })[0], d = +b.dataset.d;
    if (pmVal(k) == null) return; e.preventDefault();
    var step = function (n) { var c = pmVal(k); if (c == null) return; if (k === 'ias' && c < 1) pmSet(k, Math.round((c + d * 0.01) * 100) / 100); else pmSet(k, c + d * n); };
    step(x[2]);
    var t0 = setTimeout(function () { pmHold = setInterval(function () { step(x[3]); }, 140); }, 450);
    var stop = function () { clearTimeout(t0); if (pmHold) { clearInterval(pmHold); pmHold = null; } window.removeEventListener('pointerup', stop); };

  });
  $('pmSets').addEventListener('click', function (e) {

    v.dataset.edit = '1'; v.innerHTML = '<input type="number" step="any" value="' + cur + '">';
    var i = v.querySelector('input'); i.focus(); i.select();
    var done = function (ok) { var n = parseFloat(i.value); v.dataset.edit = ''; if (ok && isFinite(n)) pmSet(k, n); else drawPm(); };
    i.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') done(true); if (ev.key === 'Escape') done(false); });
    i.addEventListener('blur', function () { if (v.dataset.edit) done(true); });
  });
  $('pmSdk').onclick = function () {
    fetch('/fms-pmdg-sdk', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      var n = (j.files || []).length;

  function drawPm() {

    $('pmSdk').textContent = t('pmSdkBtn'); $('pmSdk').style.display = pm || ifl || fcp ? 'none' : '';

    $('pmNote').textContent = !pm ? t(fcp ? 'fcpNone' : ifl ? 'ifNoSdk' : 'pmNoSdk') : !pm.powered ? t('pmOff') : t(fcp ? 'fcpHint' : ifl ? 'ifHint' : 'pmHint');
    $('pmNote').style.color = !pm || !pm.powered ? 'var(--warn)' : 'var(--mut)';
    $('pmModes').querySelectorAll('[data-pb]').forEach(function (b) {
      var k = b.dataset.pb, on = !!(pm && pm.on && pm.on[k]), lbl = on ? 'ON' : '';
      if (k === 'fd' && pm && pm.on) { on = pm.on.fdl && pm.on.fdr; lbl = on ? 'ON' : pm.on.fdl ? 'G seul' : pm.on.fdr ? 'D seul' : ''; if (LANG === 'en' && lbl.indexOf('seul') > 0) lbl = lbl === 'G seul' ? 'L only' : 'R only'; }
      b.classList.toggle('on', on); b.classList.remove('busy');
      b.querySelector('small').textContent = pm ? lbl : '—';
    });
    PM_SET.forEach(function (x) {
      var row = $('pmSets').querySelector('[data-ps="' + x[0] + '"]'), val = row.querySelector('.val'), v = pmVal(x[0]);
      var blank = pm && ((x[0] === 'vs' && pm.vsBlank) || (x[0] === 'ias' && pm.iasBlank));
      row.classList.toggle('off', v == null || blank);
      if (!val.dataset.edit) val.textContent = v == null || blank ? '---' : x[0] === 'ias' && v < 1 ? 'M' + v.toFixed(2) : (x[0] === 'hdg' || x[0] === 'crs') ? String(v).padStart(3, '0') + x[6] : (x[0] === 'vs' && v > 0 ? '+' : '') + v + (x[0] === 'ias' ? ' kt' : x[6]);
    });
  }

  function drawAp(st, relayOk) {
    ap = st;
    var isPm = !!(st && (st.pmdg737 || st.ifly737 || st.a220));
    $('pmPanel').style.display = isPm ? '' : 'none';
    ['apModes', 'apSets', 'apLnav', 'apVnav'].forEach(function (id) { $(id).style.display = isPm ? 'none' : ''; });
    document.querySelectorAll('#scrAp .legend').forEach(function (l) { l.style.display = isPm ? 'none' : ''; });
    if (isPm) drawPm();
    var stEl = $('apSt'), note = '';
    stEl.className = 'st';
    if (!relayOk) { stEl.textContent = t('apRelay'); stEl.classList.add('bad'); note = t('apNoteRelay'); }
    else if (!st.connected) { stEl.textContent = t('apNoSim'); stEl.classList.add('bad'); }
    else if (!st.live) { stEl.textContent = t('apWait'); }
    else if (isPm) { var pmv = mcp(); stEl.textContent = (pmv && pmv.live === false) ? t('apWait') : '● ' + (st.pmdg737 ? 'PMDG' : st.ifly737 ? 'iFly' : 'A220') + ' ' + t('apOk').replace(/^AP /, ''); if (!(pmv && pmv.live === false)) stEl.classList.add('ok'); }
    else if (!st.available) { stEl.textContent = t('apNone'); stEl.classList.add('bad'); note = t('apNoteNone'); }
    else { stEl.textContent = '● ' + t('apOk'); stEl.classList.add('ok'); }
    if (st && st.custom && !note && !st.pmdg737 && !st.ifly737 && !st.a220) note = t('apNoteCustom');
    $('apAc').textContent = (st && st.aircraft) || '';
    $('apNote').textContent = note;
    var live = st && st.live && st.modes;
    var ln = live && st.lnav ? st.lnav : null, le = $('apLnav');
    le.className = 'lnavl mono';
    if (ln && ln.on && ln.to && ln.hdg >= 0) le.textContent = t('lnavTo', { p: ln.to, d: ln.dist, h: String(ln.hdg || 360).padStart(3, '0') });
    else if (ln && ln.msg) { le.textContent = ln.msg; le.classList.add('msg'); }
    else le.textContent = '';
    var il = live && st.ils && st.ils.ident ? st.ils : null;
    $('apIls').style.display = il ? '' : 'none';
    if (il) {
      var stx = T.ilsSt[il.state] ? T.ilsSt[il.state][LANG === 'en' ? 1 : 0] : '';
      $('apIlsTxt').innerHTML = 'ILS ' + esc(il.ident) + ' · ' + il.freq.toFixed(2) + ' · ' + String(il.crs).padStart(3, '0') + '°<small>' + esc(stx) + (il.dist >= 0 ? ' · ' + il.dist + ' NM' : '') + '</small>';
      var bA = $('apIlsAuto'); bA.textContent = il.auto ? t('ilsAutoOn') : t('ilsAutoOff'); bA.classList.toggle('off', !il.auto); bA.dataset.v = il.auto ? '0' : '1';
      var bR = $('apIlsArm'); bR.textContent = il.arm ? t('ilsArmOn') : t('ilsArmOff'); bR.classList.toggle('off', !il.arm); bR.dataset.v = il.arm ? '0' : '1';
      bR.style.display = il.state === 'fmc' ? 'none' : ''; bA.style.display = il.state === 'fmc' ? 'none' : '';
    }
    var cm = live && st.com ? st.com : null;
    $('apCom').style.display = cm ? '' : 'none';
    if (cm) {
      var L1 = LANG === 'en' ? 1 : 0, ph = T.comPh[cm.phase] ? T.comPh[cm.phase][L1] : '';
      var txt = !cm.auto ? esc(t('comOffTxt')) : cm.act || cm.stby
        ? 'COM1 ' + (cm.act ? cm.act.toFixed(3) + ' <small style="display:inline">' + esc(cm.actName) + '</small>' : '') + '<small>' + (cm.stby ? t('comStby') + ' ' + cm.stby.toFixed(3) + ' ' + esc(cm.stbyName) : '') + (ph ? ' · ' + ph : '') + '</small>'
        : esc(t('comWait')) + (ph ? '<small>' + ph + '</small>' : '');
      $('apComTxt').innerHTML = txt;
      var bC = $('apComAuto'); bC.textContent = cm.auto ? t('comAutoOn') : t('comAutoOff'); bC.classList.toggle('off', !cm.auto); bC.dataset.v = cm.auto ? '0' : '1';
    }
    if ($('scrChart').classList.contains('on')) drawChart();
    var vn = live && st.vnav ? st.vnav : null, ve = $('apVnav');
    ve.className = 'lnavl mono';
    if (vn && vn.on && vn.msg) { ve.textContent = vn.msg; ve.classList.add('msg'); }
    else if (vn && vn.on && vn.phase === 'climb') ve.textContent = t('vnClimb', { a: vn.alt, v: vn.climb });
    else if (vn && vn.on && vn.phase === 'path') ve.textContent = t('vnPath', { a: vn.alt, p: vn.at, e: (vn.dev > 0 ? '+' : '') + vn.dev });
    else if (vn && vn.on && vn.phase === 'cruise') ve.textContent = vn.tod >= 0 && vn.alt > 0 ? t('vnCruise', { d: vn.tod, a: vn.alt, p: vn.at }) : t('vnCruiseNone');
    else if (vn && vn.msg) { ve.textContent = vn.msg; ve.classList.add('msg'); }
    else ve.textContent = '';
    $('apModes').querySelectorAll('.md').forEach(function (b) {
      if (b.dataset.m === 'lnav' || b.dataset.m === 'vnav') {
        var f = b.dataset.m === 'lnav' ? ln : vn;
        b.classList.toggle('fms', !!(f && f.on)); b.classList.remove('busy');
        var lbl = f ? (f.on ? t('onTxt') + ' · ' : '') + t('byFms') : '—';
        if (b.dataset.m === 'vnav' && f && f.on && f.phase === 'path') lbl = 'VPATH · ' + t('byFms');
        b.querySelector('small').textContent = lbl;
        return;
      }
      var m = live ? st.modes[b.dataset.m] : null;
      b.classList.toggle('on', !!(m && m.on)); b.classList.toggle('busy', !!(m && m.busy)); b.classList.toggle('no', !!(m && m.no));
      var lbl = !m ? '—' : m.no ? t('notHandled') : (m.on ? t('onTxt') + ' · ' : '') + t('byAc');
      if (b.dataset.m === 'apr' && m && m.on && st.modes.gs && st.modes.gs.on) lbl = 'GS · ' + lbl;
      b.querySelector('small').textContent = lbl;
    });
    drawSets();
  }
  $('apIlsAuto').onclick = function () { apSend('ils_auto', +this.dataset.v); };
  $('apIlsArm').onclick = function () { apSend('ils_arm', +this.dataset.v); };
  $('apComAuto').onclick = function () { apSend('com_auto', +this.dataset.v); };
  var polling = false;
  function poll() {
    if (polling) return; polling = true;
    fetch('http://localhost:8765/ap', { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (j) { drawAp(j, true); todLive(); }, function () { drawAp({}, false); })
      .then(function () { polling = false; });
  }
  poll(); setInterval(poll, 500);

  // ---- Ouvrir un .PLN (carte du monde de MSFS, Plan de vol, Plan VFR, Little Navmap…)
  function dms(x) {
    var m = String(x).trim().match(/^([NSEW])\s*(\d+)[°\s]+(\d+)['\s]+([\d.]+)/i);
    if (!m) { var f = parseFloat(x); return isFinite(f) ? f : NaN; }
    var v = (+m[2]) + (+m[3]) / 60 + parseFloat(m[4]) / 3600;
    return /[SW]/i.test(m[1]) ? -v : v;
  }
  function parsePln(text) {
    var x = new DOMParser().parseFromString(text, 'application/xml');
    if (x.getElementsByTagName('parsererror').length) return null;
    var g = function (n, tag) { var e = n.getElementsByTagName(tag)[0]; return e ? e.textContent.trim() : ''; };
    var route = [], sid = '', star = '', appr = '', rwyDep = '', rwyArr = '';
    Array.prototype.slice.call(x.getElementsByTagName('ATCWaypoint')).forEach(function (w, i) {
      var pos = g(w, 'WorldPosition').split(','), lat = dms(pos[0]), lon = dms(pos[1]), alt = parseFloat(pos[2]);
      if (!isFinite(lat) || !isFinite(lon)) return;
      var type = g(w, 'ATCWaypointType'), id = (g(w, 'ICAOIdent') || w.getAttribute('id') || ('WP' + (i + 1))).toUpperCase();
      var d = g(w, 'DepartureFP'), a = g(w, 'ArrivalFP'), ap = g(w, 'ApproachTypeFP'), rw = g(w, 'RunwayNumberFP') + g(w, 'RunwayDesignatorFP').replace(/NONE/i, '').charAt(0);
      if (d && !sid) { sid = d; if (rw) rwyDep = rw; }
      if (a) star = a;
      if (ap) { appr = ap + (rw ? ' ' + rw : ''); if (rw) rwyArr = rw; }
      route.push({ ident: id, lat: lat, lon: lon, alt: isFinite(alt) && alt > 0 ? Math.round(alt) : 0, elev: /airport/i.test(type) && isFinite(alt) ? true : undefined, type: /airport/i.test(type) ? 'apt' : /vor/i.test(type) ? 'vor' : /ndb/i.test(type) ? 'ndb' : 'wpt',
                   via: g(w, 'ATCAirway') || d || a || (ap ? appr : ''), ap: ap ? true : undefined });
    });
    var dep = (g(x, 'DepartureID') || (route[0] || {}).ident || '').toUpperCase(), arr = (g(x, 'DestinationID') || (route[route.length - 1] || {}).ident || '').toUpperCase();
    // certains .PLN (tablette de MSFS 2024…) n'ont pas les aéroports dans la liste des points : on les rajoute
    function llaPt(tag, id) {
      var v = g(x, tag); if (!v || !id) return null;
      var pp = v.split(','), la = dms(pp[0]), lo = dms(pp[1]), el = parseFloat(pp[2]);
      if (!isFinite(la) || !isFinite(lo)) return null;
      return { ident: id, lat: la, lon: lo, alt: isFinite(el) ? Math.round(el) : 0, elev: isFinite(el) && el !== 0 ? true : undefined, type: 'apt', via: '' };
    }
    if (dep && (!route.length || route[0].ident !== dep)) { var d0 = llaPt('DepartureLLA', dep); if (d0) route.unshift(d0); }
    if (arr && (!route.length || route[route.length - 1].ident !== arr)) { var a0 = llaPt('DestinationLLA', arr); if (a0) route.push(a0); }
    if (!route.length) return null;
    // toutes les altitudes égales à la croisière (plans « VFR » de Plan VFR ou de Little Navmap) : ce ne sont pas des contraintes
    var cr = parseInt(g(x, 'CruisingAlt'), 10) || 0;
    if (cr && route.every(function (w) { return w.type === 'apt' || !w.alt || w.alt === cr; })) route.forEach(function (w) { if (w.type !== 'apt') w.alt = 0; });
    // points d'approche reconnus à leur nom (IO14L, FF14L…) juste avant le seuil de piste RW14L, quand le fichier ne le dit pas
    route.forEach(function (w, i) {
      if (!/^RW\d{2}/.test(w.ident)) return;
      w.ap = true;
      for (var k = i - 1; k >= 0 && /^[A-Z]{2}\d{2}[LRC]?$/.test(route[k].ident) && !/^RW/.test(route[k].ident); k--) route[k].ap = true;
    });
    return { origin: { icao: dep, rwy: rwyDep }, dest: { icao: arr, rwy: rwyArr }, cruiseAlt: parseInt(g(x, 'CruisingAlt'), 10) || 0,
             route: route, departure: sid, arrival: star, approach: appr, activeLeg: 1 };
  }
  $('bPln').onclick = function () { $('plnFile').value = ''; $('plnFile').click(); };
  $('plnFile').onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var plan = null; try { plan = parsePln(String(rd.result || '')); } catch (e) {}
      if (!plan) { msg(t('plnBad')); return; }
      // départ / arrivée donnés seulement par leur code (format Little Navmap pour MSFS 2024) : position et altitude prises dans la base d'aéroports
      var r0 = plan.route, need = [];
      if (plan.origin.icao && r0[0].ident !== plan.origin.icao) need.push(['dep', plan.origin.icao]);
      if (plan.dest.icao && r0[r0.length - 1].ident !== plan.dest.icao) need.push(['arr', plan.dest.icao]);
      Promise.all(need.map(function (n) {
        return fetch('/fms-airport?icao=' + encodeURIComponent(n[1])).then(function (x) { return x.json(); }).catch(function () { return {}; }).then(function (a) { return [n, a]; });
      })).then(function (res) {
        res.forEach(function (x) {
          var n = x[0], a = x[1]; if (!a || !a.ok) return;
          var w = { ident: n[1], lat: +a.lat, lon: +a.lon, alt: a.elev ? Math.round(a.elev) : 0, elev: a.elev ? true : undefined, type: 'apt', via: '' };
          if (n[0] === 'dep') r0.unshift(w); else r0.push(w);
        });
        if (r0.length < 2) { msg(t('plnBad')); return; }
        approachAlts(r0, true);
        render.scrolled = false;
        FmsStore.set({ plan: plan }, 'pln');
        msg(t('plnOk', { f: f.name }));
        setTimeout(function () { if ($('msg').textContent === t('plnOk', { f: f.name })) msg(''); }, 5000);
      });
    };
    rd.onerror = function () { msg(t('plnBad')); };
    rd.readAsText(f);
  };

  // ---- Charger SimBrief (par le relais de l'appli, comme Plan de vol)
  function user() {
    var u = window.HG_SIMBRIEF_USER || '';
    if (!u) { try { u = localStorage.getItem('avd_simbrief_user') || ''; } catch (e) {} }
    return String(u).trim();
  }
  function arr(x) { return Array.isArray(x) ? x : x ? [x] : []; }
  function num(x) { var n = parseFloat(x); return isFinite(n) ? n : 0; }
  $('bSimbrief').onclick = function () {
    var u = user(); if (!u) { msg(t('noUser')); return; }
    msg(t('loading'));
    var q = /^\d+$/.test(u) ? 'userid=' + encodeURIComponent(u) : 'username=' + encodeURIComponent(u);
    fetch('http://localhost:8765/simbrief?' + q).then(function (r) { return r.json(); }).then(function (j) {
      var fixes = arr(j && j.navlog && j.navlog.fix);
      if (!fixes.length || !j.origin || !j.destination) { msg((j && j.fetch && j.fetch.status && j.fetch.status !== 'Success') ? j.fetch.status : t('noPlan')); return; }
      var route = [{ ident: j.origin.icao_code, lat: num(j.origin.pos_lat), lon: num(j.origin.pos_long), alt: num(j.origin.elevation), elev: true, type: 'apt', via: '' }];
      var sid = '', star = '', enroute = false;
      fixes.forEach(function (f) {
        if (f.ident === 'TOC' || f.ident === 'TOD') return;          // calculés par le FMS plus tard (VPATH)
        if (f.ident === j.destination.icao_code && f.type === 'apt') return;
        if (f.is_sid_star === '1' && f.via_airway && f.via_airway !== 'DCT') { if (!enroute) sid = f.via_airway; else star = f.via_airway; }
        else enroute = true;
        route.push({ ident: f.ident, lat: num(f.pos_lat), lon: num(f.pos_long), alt: num(f.altitude_feet), type: f.type || '', via: f.via_airway && f.via_airway !== 'DCT' ? f.via_airway : '' });
      });
      route.push({ ident: j.destination.icao_code, lat: num(j.destination.pos_lat), lon: num(j.destination.pos_long), alt: num(j.destination.elevation), elev: true, type: 'apt', via: '' });
      render.scrolled = false;
      FmsStore.set({ plan: {
        origin: { icao: j.origin.icao_code || '', rwy: j.origin.plan_rwy || '' },
        dest: { icao: j.destination.icao_code || '', rwy: j.destination.plan_rwy || '' },
        cruiseAlt: num(j.general && j.general.initial_altitude),
        route: route, departure: sid, arrival: star, approach: '', activeLeg: 1
      } }, 'simbrief');
      msg('');
    }).catch(function () { msg(t('relay')); });
  };
})();
