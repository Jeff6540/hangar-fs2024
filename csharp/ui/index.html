<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Hangar FS 2024</title>
<style>
:root{--bg:#15181e;--panel:#1c2028;--field:#252a34;--hover:#2e3440;--border:#2b313c;--fg:#e8eaef;--muted:#8a93a3;
--accent:#3b82f6;--accent-hi:#5b98fa;--sel:#284a80;--danger:#b9383a;--danger-hi:#d0484a;--warn:#f0a050;--off:#6b7280;
--ok:#4ade80;--warn-btn:#b06a14;--active-row:#1d3a2c;--cat-ours:#1d3a2c;--cat-real:#3a3020;--cat-ext:#1c3140;
--cat-off:#2e2840;--cat-broken:#4a2226;--cat-defoff:#3a3a1c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px "Segoe UI Variable Text","Segoe UI",sans-serif;overflow:hidden;user-select:none}
body{display:flex;flex-direction:column}
input,select,button{font:inherit;color:var(--fg)}
#top{position:relative;flex:none;height:72px;overflow:hidden;background:var(--bg)}
#top img{height:72px;display:block}
#flags{display:flex;gap:4px;align-items:center;padding-bottom:6px}
#flags button{background:transparent;border:2px solid transparent;border-radius:3px;padding:1px;cursor:pointer;line-height:0}
#flags button:hover{border-color:var(--hover)}
#flags button.on{border-color:var(--accent)}
#flags img{width:34px;height:23px;display:block}
#flags .tuto{margin-left:10px;background:var(--accent);color:#fff;font-weight:700;font-size:12.5px;line-height:normal;padding:5px 12px;border:none;border-radius:4px}
#flags .tuto:hover{background:var(--accent-hi)}
#lock{display:none;flex:none;background:var(--danger);color:#fff;font-weight:700;text-align:center;padding:8px}
body.sim #lock{display:block}
nav{flex:none;display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--border)}
nav > button{background:transparent;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;padding:8px 16px;cursor:pointer;color:var(--muted)}
nav > button:hover{color:var(--fg);background:var(--panel)}
nav > button.on{background:var(--panel);color:var(--fg);border-color:var(--border)}
nav > button.soon{opacity:.55}
main{flex:1;min-height:0;background:var(--panel);margin:0 8px;border:1px solid var(--border);border-top:none}
.tab{display:none;height:100%;padding:14px;flex-direction:column;gap:10px;min-height:0}
.tab.on{display:flex}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{background:var(--field);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.accent{background:var(--accent);border-color:var(--accent)}
.btn.accent:hover{background:var(--accent-hi)}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger-hi)}
.btn:disabled{opacity:.45;cursor:default}
body.sim .lk{opacity:.45;pointer-events:none}
input[type=text]{background:var(--field);border:1px solid var(--border);border-radius:6px;padding:6px 8px;outline:none}
input[type=text]:focus{border-color:var(--accent)}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.muted{color:var(--muted)}
.title{font-size:16px;font-weight:600}
.split{flex:1;min-height:0;display:flex;gap:12px}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;min-height:0}
.pane.lib{flex:1.5}
.head{font-size:15.5px;font-weight:700}
select{background:var(--field);border:1px solid var(--border);border-radius:6px;padding:6px 8px;min-width:200px;outline:none}
table.fixed{table-layout:fixed}table.fixed td{max-width:none}
.tw{display:inline-block;width:16px;color:var(--muted)}
tr.grp td{font-weight:700}
.soonbtn{opacity:.5}
.btn.warnb{background:var(--warn-btn);border-color:var(--warn-btn)}
.cc-ours{--cc:var(--cat-ours)}.cc-real{--cc:var(--cat-real)}.cc-ext{--cc:var(--cat-ext)}.cc-off{--cc:var(--cat-off)}.cc-broken{--cc:var(--cat-broken)}.cc-defoff{--cc:var(--cat-defoff)}
tr.citem td{background:var(--cc);cursor:pointer}
tr.citem.cc-broken td{color:#ff9a9a}
tr.citem:hover td{filter:brightness(1.25)}
tr.citem.sel td{background:var(--sel)}
.chip.cc-ours,.chip.cc-real,.chip.cc-ext,.chip.cc-off,.chip.cc-broken,.chip.cc-defoff{background:var(--cc);border-radius:3px;padding:3px 7px;font-size:12px}
.list{flex:1;min-height:0;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:6px}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--field);text-align:left;font-weight:600;padding:6px 8px;z-index:1;white-space:nowrap}
td{padding:4px 8px;border-bottom:1px solid #1f242c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
tr.item{cursor:pointer}
tr.item:hover td{background:var(--hover)}
tr.item.act td{background:var(--active-row)}
tr.item.act:hover td{background:#25483a}
tr.item.chk td{background:var(--sel)}
tr.grp td{background:#20252e;font-weight:600;cursor:pointer;color:#cdd3de}
tr.grp td .n{color:var(--muted);font-weight:400}
.box{display:inline-block;width:15px;height:15px;border:1.5px solid var(--muted);border-radius:3px;vertical-align:middle;position:relative}
.box.on{background:var(--accent);border-color:var(--accent)}
.box.on::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.box.part{background:var(--accent);border-color:var(--accent)}
.box.part::after{content:"";position:absolute;left:2px;top:5px;width:8px;height:2px;background:#fff}
.box.act{background:#16a34a;border-color:#16a34a}
.box.act::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.box.actpart{background:#16a34a;border-color:#16a34a}
.box.actpart::after{content:"";position:absolute;left:2px;top:5px;width:8px;height:2px;background:#fff}
.box.acton{background:var(--accent);border:2px solid #4ade80}
.box.acton::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
#commList table{table-layout:fixed}#commList td{max-width:none}
.st-flight{color:var(--ok)}.st-linked{color:var(--ok)}.st-ext{color:#7cc4ff}.st-real{color:var(--warn)}
.star{color:#f5c542}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--border);border-radius:12px;padding:2px 10px;cursor:pointer;font-size:12px;background:var(--field)}
.chip.on{outline:2px solid var(--accent)}
.c-ours td:first-child{border-left:4px solid #2f8f5b}.c-real td:first-child{border-left:4px solid #b88a3a}
.c-ext td:first-child{border-left:4px solid #3a86b8}.c-off td:first-child{border-left:4px solid #7a68b8}
.c-broken td{background:var(--cat-broken)}.c-defoff td:first-child{border-left:4px solid #b8b83a}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
#log{flex:1;min-height:120px;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font:12.5px Consolas,monospace;white-space:pre-wrap;user-select:text}
.apt-off td{color:var(--off)}.apt-none td{color:var(--warn)}
.form{display:grid;grid-template-columns:max-content 1fr auto auto;gap:8px 10px;align-items:center;max-width:1100px}
.form input[type=text]{width:100%}
.note{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--muted);white-space:pre-wrap;max-width:1100px;line-height:1.45}
.soonbox{margin:auto;text-align:center;color:var(--muted);max-width:560px;line-height:1.6}
.soonbox .big{font-size:42px}
footer{flex:none;display:flex;align-items:center;gap:18px;padding:6px 14px}
#status{flex:1;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#simlbl{color:var(--muted)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10}
#modal.on{display:flex}
#mbox{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 20px;min-width:420px;max-width:680px;max-height:85vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#mtext{white-space:pre-wrap;line-height:1.45;margin-bottom:14px}
#mbody{margin-bottom:14px}
#mbtns{display:flex;justify-content:flex-end;gap:8px}
fieldset{border:1px solid var(--border);border-radius:8px;margin:8px 0;padding:6px 12px}
legend{color:var(--muted);padding:0 6px}
fieldset label{display:block;padding:3px 0;cursor:pointer}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:#3a414e;border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:var(--bg)}
</style>
</head>
<body>
<div id="top"><img id="banner" alt=""></div>
<div id="lock" data-t="lockBanner"></div>
<nav id="tabs">
  <button data-tab="lib" data-t="tabLib"></button>
  <button data-tab="soon-map" class="soon" data-t="tabMap"></button>
  <button data-tab="soon-launch" class="soon" data-t="tabLaunch"></button>
  <button data-tab="vol" data-t="tabVol"></button>
  <button data-tab="soon-dispatch" class="soon" data-t="tabDispatch"></button>
  <button data-tab="set" data-t="tabSet"></button>
  <span class="grow"></span>
  <div id="flags"><button data-lang="fr" title="Français"><img src="{{FLAG_FR}}" alt="FR"></button><button data-lang="en" title="English"><img src="{{FLAG_EN}}" alt="EN"></button><button id="bTuto" class="tuto soonbtn" data-t="tuto"></button></div>
</nav>
<main>
  <!-- Bibliothèque -->
  <section class="tab" id="tab-lib">
    <div class="split">
      <div class="pane lib">
        <div class="row"><span class="head" id="libHead"></span><span class="grow"></span>
          <button class="btn" id="bExpand" data-t="expandAll"></button>
          <button class="btn" id="bCollapse" data-t="collapseAll"></button>
          <button class="btn" id="bRescan" data-t="refreshCheck"></button></div>
        <div class="row"><input type="text" id="search" class="grow"><select id="filter"></select></div>
        <div class="list" id="libList"></div>
        <div class="row">
          <button class="btn" id="bCheckAll" data-t="checkAll"></button>
          <button class="btn" id="bUncheckAll" data-t="uncheckAll"></button>
          <button class="btn accent lk" id="bActivate" style="margin-left:12px"></button>
          <button class="btn danger lk" id="bRemove"></button>
          <button class="btn lk" id="bUndo"></button>
          <span class="muted" id="checkedLbl"></span>
        </div>
        <div class="row">
          <button class="btn lk" id="bPin" data-t="pin"></button>
          <button class="btn lk" id="bUnpin" data-t="unpin"></button>
          <button class="btn soonbtn" data-t="profiles"></button>
          <button class="btn" id="bIcao" data-t="icaoBtn"></button>
          <button class="btn soonbtn" data-t="dups"></button>
          <span class="grow"></span>
          <button class="btn warnb soonbtn" data-t="quar"></button>
          <button class="btn soonbtn" data-t="viewQuar"></button>
        </div>
      </div>
      <div class="pane">
        <div class="row"><span class="head" id="commHead">Community</span><span class="grow"></span>
          <button class="btn" id="bOpenComm" data-t="openFolder"></button>
          <button class="btn" id="bCommRefresh">⟳</button></div>
        <div class="row"><input type="text" id="csearch" class="grow"></div>
        <div class="list" id="commList"></div>
        <div class="chips" id="chips"></div>
        <div class="row"><button class="btn danger lk" id="bCommRemove" data-t="commRemove"></button><span class="muted" data-t="onlyLinks"></span></div>
      </div>
    </div>
  </section>

  <!-- Vol SimBrief -->
  <section class="tab" id="tab-vol">
    <div class="row">
      <span data-t="simbriefId"></span>
      <input type="text" id="sbUser" style="width:200px">
      <button class="btn" id="bFetch" data-t="fetch"></button>
      <span class="grow"></span>
      <button class="btn" data-url="https://dispatch.simbrief.com/" data-t="openSimbrief"></button>
      <button class="btn" data-url="https://lfv-planner.netlify.app/">🌐  LFV Planner</button>
    </div>
    <div class="title" id="planLbl"></div>
    <div class="list" style="flex:none;max-height:220px"><table id="aptTable"></table></div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="optAlt"><span data-t="optAlt"></span></label>
      <label class="chk" style="margin-left:16px"><input type="checkbox" id="optAuto"><span data-t="optAuto"></span></label>
    </div>
    <div class="row">
      <button class="btn accent lk" id="bPrepare" data-t="prepare"></button>
      <button class="btn lk" id="bEnd" data-t="endFlight"></button>
      <span id="flightLbl"></span>
    </div>
    <div data-t="journal"></div>
    <div id="log"></div>
  </section>

  <!-- Réglages -->
  <section class="tab" id="tab-set" style="overflow:auto">
    <div class="form">
      <span data-t="setLib"></span><input type="text" id="sLib"><button class="btn" data-browse="sLib" data-t="browse"></button><span></span>
      <span data-t="setComm"></span><input type="text" id="sComm"><button class="btn" data-browse="sComm" data-t="browse"></button><button class="btn" id="bDetect" data-t="detect"></button>
      <span data-t="simbriefId"></span><input type="text" id="sUser"><span></span><span></span>
      <span data-t="setExe"></span><input type="text" id="sExe"><span></span><span></span>
    </div>
    <div class="row"><button class="btn accent" id="bSave" data-t="save"></button></div>
    <div class="note" data-t="setHelp"></div>
    <div class="note" data-t="testNote"></div>
    <div class="row">
      <button class="btn" data-url="https://github.com/jeff6540/hangar-fs2024">GitHub</button>
      <span class="muted">Hangar FS 2024 {{VERSION}} — © 2026 Jeff40 — MIT License</span>
    </div>
  </section>

  <section class="tab" id="tab-soon">
    <div class="soonbox"><div class="big">🛠</div><div class="title" id="soonTitle"></div><p data-t="soonText"></p></div>
  </section>
</main>
<footer>
  <span id="status"></span>
  <span id="simlbl"></span>
  <button class="btn" id="bQuit" data-t="quit"></button>
</footer>
<div id="modal"><div id="mbox"><div id="mtext"></div><div id="mbody"></div><div id="mbtns"></div></div></div>

let LANG = "fr";
function t(k){ const v = TXT[k]; return v ? v[LANG === "en" ? 1 : 0] : k; }
function tf(k){ let s = t(k); for (let i = 1; i < arguments.length; i++) s = s.replace("%s", arguments[i]); return s; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- échanges avec le C#
const pending = {}; let seq = 0;
function call(cmd, args){
  return new Promise((resolve, reject) => {
    const id = ++seq; pending[id] = {resolve, reject};
    window.chrome.webview.postMessage({id, cmd, args: args || {}});
  });
}
window.chrome.webview.addEventListener("message", ev => {
  const m = ev.data;
  if (m && m.id !== undefined && pending[m.id]) {
    const p = pending[m.id]; delete pending[m.id];
    if (m.ok) p.resolve(m.data); else p.reject(new Error(m.error));
  } else if (m && m.event) onEvent(m.event, m.data);
});
async function run(cmd, args){
  try { return await call(cmd, args); }
  catch (e) { await alertBox(e.message); return undefined; }
}

// ---------------------------------------------------------------- fenêtres de dialogue
function modal(text, buttons, bodyNode){
  return new Promise(resolve => {
    $("mtext").textContent = text;
    const body = $("mbody"); body.innerHTML = ""; if (bodyNode) body.appendChild(bodyNode);
    body.style.display = bodyNode ? "" : "none";
    const bt = $("mbtns"); bt.innerHTML = "";
    buttons.forEach(b => {
      const el = document.createElement("button"); el.className = "btn" + (b.cls ? " " + b.cls : ""); el.textContent = b.label;
      el.onclick = () => { $("modal").classList.remove("on"); resolve(b.value); };
      bt.appendChild(el);
    });
    $("modal").classList.add("on");
    const inp = body.querySelector("input[type=text]"); if (inp) setTimeout(() => inp.focus(), 30);
  });
}
const alertBox = text => modal(text, [{label: t("ok"), value: true, cls: "accent"}]);
const confirmBox = (text, danger) => modal(text, [{label: t("no"), value: false}, {label: t("yes"), value: true, cls: danger ? "danger" : "accent"}]);
async function promptBox(text, value){
  const inp = document.createElement("input"); inp.type = "text"; inp.value = value || ""; inp.style.width = "100%";
  const r = await modal(text, [{label: t("cancel"), value: null}, {label: t("ok"), value: "ok", cls: "accent"}], inp);
  return r === "ok" ? inp.value : null;
}
document.addEventListener("keydown", e => {
  if (!$("modal").classList.contains("on")) return;
  if (e.key === "Escape") { const b = $("mbtns").firstChild; if (b) b.click(); }
  if (e.key === "Enter") { const b = $("mbtns").lastChild; if (b) b.click(); }
});

const isOn = p => p.status !== "none" && p.status !== "?";
const FILTERS = ["all", "apt", "pin", "in", "out"];
let opened = new Set(), undoInfo = null, freeSpace = "";
function boxHtml(state){ const c = {2: "on", 1: "part", act: "act", actpart: "actpart", acton: "acton"}[state]; return '<span class="box' + (c ? " " + c : "") + '"></span>'; }
function visible(){
  const q = $("search").value.trim().toLowerCase(), f = $("filter").value || "all";
  return PKGS.filter(p => {
    if (q && !(p.name + " " + p.title + " " + p.icao.join(" ")).toLowerCase().includes(q)) return false;
    if (f === "apt" && !p.icao.length) return false;
    if (f === "pin" && !p.pinned) return false;
    if (f === "in" && !isOn(p)) return false;
    if (f === "out" && isOn(p)) return false;
    return true;
  });
}
function buildTree(list){
  const root = {name: "", path: "", kids: new Map(), items: []};
  list.forEach(p => {
    let node = root;
    if (p.group) {
      let acc = "";
      p.group.split(/[\\\/]/).forEach(part => {
        acc = acc ? acc + "\\" + part : part;
        if (!node.kids.has(part.toLowerCase())) node.kids.set(part.toLowerCase(), {name: part, path: acc, kids: new Map(), items: []});
        node = node.kids.get(part.toLowerCase());
      });
    }
    node.items.push(p);
  });
  return root;
}
function leaves(node){ let r = node.items.slice(); node.kids.forEach(k => { r = r.concat(leaves(k)); }); return r; }
let TREE = null;
function findNode(node, path){
  if (node.path === path) return node;
  for (const k of node.kids.values()) { const r = findNode(k, path); if (r) return r; }
  return null;
}
const TYPE_TITLE = s => s ? s.charAt(0) + s.slice(1).toLowerCase() : "";
function renderLib(){
  const list = $("libList");
  updateLibHead();
  if (!SETTINGS.library) { list.innerHTML = '<div class="muted" style="padding:14px">' + esc(t("noLib")) + "</div>"; updateButtons(); return; }
  const scroll = list.scrollTop, searching = !!$("search").value.trim();
  TREE = buildTree(visible());
  let h = "<table class='fixed'><colgroup><col><col style='width:24%'><col style='width:70px'><col style='width:72px'><col style='width:78px'><col style='width:82px'><col style='width:92px'></colgroup>" +
          "<thead><tr><th>" + esc(t("colName")) + "</th><th>" + esc(t("colTitle")) + "</th><th>" + esc(t("colType")) + "</th><th>" + esc(t("colVer")) +
          "</th><th>ICAO</th><th>" + esc(t("colPin")) + "</th><th>Community</th></tr></thead><tbody>";
  const rowItem = (p, depth) => {
    const on = isOn(p), ck = checked.has(p.path);
    return '<tr class="item' + (ck ? " chk" : on ? " act" : "") + '" data-p="' + esc(p.path) + '"><td style="padding-left:' + (10 + depth * 20) + 'px" title="' + esc(p.path) + '">' +
      '<span class="tw"></span>' + boxHtml(ck ? (on ? "acton" : 2) : (on ? "act" : 0)) + " " + esc(p.name) + "</td><td>" + esc(p.title) + "</td><td>" + esc(TYPE_TITLE(p.type)) +
      "</td><td>" + esc(p.version) + "</td><td>" + esc(p.icao.join(", ")) + (p.icaoManual ? " ✎" : "") + "</td><td class='star'>" + (p.pinned ? "★" : "") +
      "</td><td class='st-" + esc(p.status) + "'>" + esc(t("st" + p.status)) + "</td></tr>";
  };
  const walk = (node, depth) => {
    [...node.kids.values()].sort((a, b) => a.name.localeCompare(b.name, undefined, {sensitivity: "base"})).forEach(k => {
      const all = leaves(k), nChk = all.filter(p => checked.has(p.path)).length, nAct = all.filter(isOn).length;
      const st = nChk ? (nChk === all.length ? 2 : 1) : (nAct && nAct === all.length ? "act" : nAct ? "actpart" : 0);
      const open = searching || opened.has(k.path);
      h += '<tr class="grp" data-g="' + esc(k.path) + '"><td colspan="7" style="padding-left:' + (10 + depth * 20) + 'px"><span class="tw">' + (open ? "▾" : "▸") +
           '</span><span data-gbox="1">' + boxHtml(st) + "</span> " + esc(k.name) + " (" + nAct + " / " + all.length + ")</td></tr>";
      if (open) walk(k, depth + 1);
    });
    node.items.forEach(p => { h += rowItem(p, depth); });
  };
  walk(TREE, 0);
  list.innerHTML = h + "</tbody></table>";
  list.scrollTop = scroll;
  updateButtons();
}
function updateLibHead(){
  const nAct = PKGS.filter(isOn).length;
  $("libHead").textContent = SETTINGS.library ? tf("libHead", PKGS.length, nAct) + (freeSpace ? tf("freeSp", freeSpace) : "") : t("library");
}
$("libList").addEventListener("click", e => {
  const tr = e.target.closest("tr"); if (!tr) return;
  if (tr.classList.contains("grp")) {
    const g = tr.dataset.g;
    if (e.target.closest("[data-gbox]")) {
      const node = findNode(TREE, g); if (!node) return;
      const all = leaves(node), every = all.every(p => checked.has(p.path));
      all.forEach(p => every ? checked.delete(p.path) : checked.add(p.path));
    } else { opened.has(g) ? opened.delete(g) : opened.add(g); }
    renderLib(); return;
  }
  const p = tr.dataset.p; if (!p) return;
  checked.has(p) ? checked.delete(p) : checked.add(p);
  renderLib();
});
function checkedPkgs(){ return PKGS.filter(p => checked.has(p.path)); }
function updateButtons(){
  const sel = checkedPkgs(), n = sel.length;
  const inComm = sel.filter(isOn).length, absent = n - inComm;
  $("bActivate").textContent = absent ? tf("activateN", absent) : inComm ? t(inComm > 1 ? "allActive" : "oneActive") : t("activate");
  $("bRemove").textContent = inComm ? tf("removeN", inComm) : absent ? t("noneIn") : t("remove");
  $("checkedLbl").textContent = tf("checkedN", n);
  const u = undoInfo;
  $("bUndo").textContent = u ? tf(u.kind === "activate" ? "undoAct" : "undoRem", u.n) : t("undo");
  $("bUndo").disabled = !u;
}
function fillFilter(){
  const f = $("filter"), cur = f.value || "all";
  f.innerHTML = FILTERS.map(k => '<option value="' + k + '">' + esc(t("flt" + k)) + "</option>").join("");
  f.value = cur;
}

$("filter").addEventListener("change", renderLib);
$("bCheckAll").onclick = () => { visible().forEach(p => checked.add(p.path)); renderLib(); };
$("bUncheckAll").onclick = () => { checked.clear(); renderLib(); };
$("bExpand").onclick = () => { const add = n => n.kids.forEach(k => { opened.add(k.path); add(k); }); add(buildTree(PKGS)); renderLib(); };
$("bCollapse").onclick = () => { opened.clear(); renderLib(); };
$("bRescan").onclick = () => run("rescan");
$("bActivate").onclick = async () => {
  const sel = checkedPkgs(); if (!sel.length) return alertBox(t("nothingChecked"));
  const todo = sel.filter(p => !isOn(p)); if (!todo.length) { checked.clear(); renderLib(); return; }
  const r = await run("activate", {paths: todo.map(p => p.path)});
  if (r) checked.clear();
  loadLibrary();
};
$("bRemove").onclick = async () => {
  const sel = checkedPkgs().filter(isOn);
  if (!checkedPkgs().length) return alertBox(t("nothingChecked"));
  if (!sel.length) return alertBox(t("noneInComm"));
  const names = sel.slice(0, 12).map(p => "• " + p.name).join("\n") + (sel.length > 12 ? "\n• …" : "");
  let msg = tf("confirmRemove", sel.length, names);
  const nPin = sel.filter(p => p.pinned).length;
  if (nPin) msg += tf("pinLost", nPin);
  if (!await confirmBox(msg, true)) return;
  if (sel.length > 20 && !await confirmBox(tf("confirmRemoveBig", sel.length, PKGS.filter(isOn).length), true)) return;
  const r = await run("remove", {paths: sel.map(p => p.path)});
  if (r) checked.clear();
  loadLibrary();
};
$("bUndo").onclick = async () => { await run("undo"); checked.clear(); loadLibrary(); };
$("bPin").onclick = async () => {
  const sel = checkedPkgs(); if (!sel.length) return alertBox(t("nothingChecked"));
  await run("pin", {paths: sel.map(p => p.path), on: true}); checked.clear(); loadLibrary();
};
$("bUnpin").onclick = async () => {
  const sel = checkedPkgs(); if (!sel.length) return alertBox(t("nothingChecked"));
  await run("pin", {paths: sel.map(p => p.path), on: false}); checked.clear(); loadLibrary();
};
$("bIcao").onclick = async () => {
  const sel = checkedPkgs(); if (sel.length !== 1) return alertBox(t("icaoOne"));
  const p = sel[0];
  const v = await promptBox(tf("icaoPrompt", p.title || p.name), p.icao.join(" "));
  if (v === null) return;
  await run("setIcao", {path: p.path, codes: v.split(/[\s,;]+/).filter(Boolean)});
  loadLibrary();
};

// ---------------------------------------------------------------- Community
const CATS = ["ours", "real", "ext", "off", "broken", "defoff"];
let commSel = new Set(), commSize = null, commSizeKey = "";
function renderComm(){
  const counts = {}; CATS.forEach(c => counts[c] = 0); COMM.forEach(c => counts[c.cat]++);
  $("chips").innerHTML = CATS.map(c => '<span class="chip cc-' + c + (commFilter === c ? " on" : "") + '" data-cat="' + c + '">' + esc(t("cat" + c)) + " : " + counts[c] + "</span>").join("");
  const q = $("csearch").value.trim().toLowerCase();
  const rows = COMM.filter(c => (!commFilter || c.cat === commFilter) && (!q || (c.name + " " + c.title + " " + c.creator).toLowerCase().includes(q)));
  const scroll = $("commList").scrollTop;
  let h = "<table class='fixed'><colgroup><col><col style='width:24%'><col style='width:15%'><col style='width:66px'><col style='width:92px'></colgroup><thead><tr><th>" +
          esc(t("colName")) + "</th><th>" + esc(t("colTitle")) + "</th><th>" + esc(t("colCreator")) + "</th><th>" + esc(t("colVer")) + "</th><th>" + esc(t("colState")) + "</th></tr></thead><tbody>";
  rows.forEach(c => {
    h += '<tr class="citem cc-' + c.cat + (commSel.has(c.path) ? " sel" : "") + '" data-c="' + esc(c.path) + '" title="' + esc(c.target || c.path) + '"><td>' + esc(c.name) +
         "</td><td>" + esc(c.title) + "</td><td>" + esc(c.creator) + "</td><td>" + esc(c.version) + "</td><td>" + esc(c.label) + "</td></tr>";
  });
  $("commList").innerHTML = h + "</tbody></table>";
  $("commList").scrollTop = scroll;
  updateCommHead();
  const key = COMM.map(c => c.path).join("|");
  if (key !== commSizeKey) {
    commSizeKey = key; commSize = null; updateCommHead();
    call("communitySize", {paths: COMM.filter(c => c.cat !== "broken").map(c => c.path)}).then(s => { if (key === commSizeKey) { commSize = s; updateCommHead(); } }, () => {});
  }
}
function updateCommHead(){
  if (!SETTINGS.community) { $("commHead").textContent = t("commNotFoundHead"); return; }
  $("commHead").textContent = tf("commHead", commSize === null ? t("computingSize") : commSize, COMM.length);
}
$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  commFilter = commFilter === c.dataset.cat ? null : c.dataset.cat; renderComm();
});
$("csearch").addEventListener("input", renderComm);
$("commList").addEventListener("click", e => {
  const tr = e.target.closest("tr.citem"); if (!tr) return;
  const p = tr.dataset.c;
  if (!e.ctrlKey && !e.shiftKey && !commSel.has(p)) commSel.clear();
  commSel.has(p) ? commSel.delete(p) : commSel.add(p);
  renderComm();
});
$("bOpenComm").onclick = () => run("openFolder", {path: SETTINGS.community});
$("bCommRefresh").onclick = () => { commSizeKey = ""; loadLibrary(); };
$("bCommRemove").onclick = async () => {
  const sel = COMM.filter(c => commSel.has(c.path));
  if (!sel.length) return alertBox(t("noCommChecked"));
  const links = sel.filter(c => c.link);
  if (!links.length) return alertBox(t("onlyRealSel"));
  if (!await confirmBox(tf("confirmCommRemove", links.length), true)) return;
  await run("removeCommunity", {links: links.map(c => c.path)});
  commSel.clear(); loadLibrary();
};

let loading = false, reloadAgain = false;
async function loadLibrary(){
  if (loading) { reloadAgain = true; return; }
  loading = true;
  try {
    const d = await call("library");
    PKGS = d.packages; COMM = d.community; undoInfo = d.undo; freeSpace = d.free || "";
    SETTINGS.library = d.library; SETTINGS.community = d.communityPath;
    const known = new Set(PKGS.map(p => p.path)); [...checked].forEach(p => { if (!known.has(p)) checked.delete(p); });
    const knownC = new Set(COMM.map(c => c.path)); [...commSel].forEach(p => { if (!knownC.has(p)) commSel.delete(p); });
    renderLib(); renderComm();
  } catch (e) { /* rien */ }
  loading = false;
  if (reloadAgain) { reloadAgain = false; loadLibrary(); }
}

  else {
    const p = d.plan;
    let txt = (p.flight ? p.flight + "    " : "") + p.route + (p.aircraft ? "    (" + p.aircraft + ")" : "");
    $("planLbl").textContent = txt;
    let h = "<thead><tr><th>" + esc(t("colRole")) + "</th><th>ICAO</th><th>" + esc(t("colApt")) + "</th><th>" + esc(t("colScenes")) + "</th></tr></thead><tbody>";
    p.airports.forEach(a => {
      const cls = !a.used ? "apt-off" : (a.scenes.length ? "" : "apt-none");
      h += '<tr class="' + cls + '"><td>' + esc(LANG === "en" ? (ROLE_EN[a.role] || a.role) : a.role) + "</td><td>" + esc(a.icao) + "</td><td>" + esc(a.name) +

        return '<label><input type="radio" name="ch-' + esc(c.icao) + '" value="' + esc(o.path) + '"' + (o.path === c.default ? " checked" : "") + "> " +
               esc(o.title) + ' <span class="muted">(' + esc(o.name) + ")" + (extra ? "   · " + esc(extra) : "") + "</span></label>";
      }).join("");
      wrap.appendChild(fs);
    });
    const ok = await modal(t("chooseTitle"), [{label: t("cancel"), value: false}, {label: t("chooseOk"), value: true, cls: "accent"}], wrap);
    if (!ok) return;
    const choices = {};
    r.needChoice.forEach(c => { const el = wrap.querySelector('input[name="ch-' + c.icao + '"]:checked'); if (el) choices[c.icao] = el.value; });
    r = await run("prepareFlight", {choices});
  }
  refreshFlight(); loadLibrary();
};
$("bEnd").onclick = async () => { await run("endFlight"); refreshFlight(); loadLibrary(); };

// ---------------------------------------------------------------- réglages
function fillSettings(s){
  SETTINGS = s;
  $("sLib").value = s.library || ""; $("sComm").value = s.community || ""; $("sUser").value = s.simbrief_user || "";
  $("sExe").value = s.sim_exe || ""; $("sbUser").value = s.simbrief_user || "";
  $("optAlt").checked = !!s.include_alternates; $("optAuto").checked = !!s.auto_unlink;
}
document.querySelectorAll("[data-browse]").forEach(b => b.onclick = async () => {
  const inp = $(b.dataset.browse);
  const v = await run("browse", {title: t(b.dataset.browse === "sLib" ? "pickLib" : "pickComm"), current: inp.value});
  if (v) inp.value = v;
});
$("bDetect").onclick = async () => {
  const v = await run("detectCommunity");
  if (v) $("sComm").value = v; else alertBox(t("commNotFound"));
};
$("bSave").onclick = async () => {
  const s = {library: $("sLib").value, community: $("sComm").value, simbrief_user: $("sUser").value, sim_exe: $("sExe").value,
             include_alternates: $("optAlt").checked, auto_unlink: $("optAuto").checked};
  const r = await call("saveSettings", s).then(() => true, e => { alertBox(e.message); return false; });
  if (r) { Object.assign(SETTINGS, s); fillSettings(SETTINGS); }
};

// ---------------------------------------------------------------- divers
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
document.querySelectorAll("[data-url]").forEach(b => b.onclick = () => run("openUrl", {url: b.dataset.url}));
document.querySelectorAll("#flags button[data-lang]").forEach(b => b.onclick = async () => {
  if (b.dataset.lang === LANG) return;
  LANG = b.dataset.lang; await run("setLang", {lang: LANG}); commSizeKey = ""; applyLang(); loadLibrary();
});
$("bQuit").onclick = () => run("quit");
document.addEventListener("contextmenu", e => { if (!e.target.closest("input")) e.preventDefault(); });

function onEvent(ev, data){
  if (ev === "log") {
    const l = $("log"); const atEnd = l.scrollTop + l.clientHeight >= l.scrollHeight - 4;
    l.textContent += (l.textContent ? "\n" : "") + data;
    if (atEnd) l.scrollTop = l.scrollHeight;
  } else if (ev === "status") $("status").textContent = data;
  else if (ev === "sim") setSim(data);
  else if (ev === "changed") { loadLibrary(); if (currentTab === "vol") refreshFlight(); }
}

(async function init(){
  const d = await call("init");
  LANG = d.lang === "en" ? "en" : "fr";
  fillSettings(d.settings);
  setSim(d.sim);
  applyLang();
  showTab(d.settings.library ? "lib" : "set");
  loadLibrary();
})();
</script>
</body>
