<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Hangar FS 2024</title>
<style>
:root{--bg:#0B0F14;--panel:#121821;--field:#0F151C;--hover:#18222E;--border:#1E2733;--line:#253041;--fg:#E6EDF5;--muted:#8B98A9;
--accent:#38BDF8;--accent-hi:#7DD3FC;--ink:#06202C;--sel:#14263A;--danger:#E5484D;--danger-hi:#F06368;--warn:#F5B544;--off:#6b7280;
--ok:#34D399;--warn-btn:#F5B544;--active-row:#11241C;--cat-ours:#11241C;--cat-real:#2A2214;--cat-ext:#112634;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px "Segoe UI Variable Text","Segoe UI",sans-serif;overflow:hidden;user-select:none}
body{display:flex;flex-direction:row}
/* ---- design 12.3 : menu à gauche (rétractable) + contenu */
#side{flex:none;width:236px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:14px;padding:16px 12px;transition:width .15s}
#side .brand{display:flex;align-items:center;gap:10px;padding:0 4px}

#bRail{align-self:flex-start;margin-left:4px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;white-space:nowrap}
#bRail:hover{color:var(--fg);background:var(--hover)}
#tabs{display:flex;flex-direction:column;gap:3px;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#2a3647 transparent;margin-right:-6px;padding-right:6px}
#tabs::-webkit-scrollbar{width:6px}#tabs::-webkit-scrollbar-thumb{background:#2a3647;border-radius:6px}
.sidefoot{flex:none}
#tabs > *{flex:none}
@media (max-height:940px){#bDiscord,#bDiscordLfv{padding:5px 9px;margin-bottom:6px}#bDiscord .dc-t > :not(:first-child),#bDiscordLfv .dc-t > :not(:first-child){display:none}#bDiscord .dc-logo svg,#bDiscord .dc-logo img,#bDiscordLfv .dc-logo img{width:24px!important;height:24px!important}.sidefoot{gap:6px}}
#tabs > button{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:10px;border:0;background:transparent;color:#B4C0CF;font-weight:500;cursor:pointer;text-align:left;white-space:nowrap}
#tabs > button svg{flex:none;width:18px;height:18px;stroke:currentColor}
#tabs > button:hover{background:var(--hover);color:var(--fg)}
#tabs > button.on{background:#1A2430;color:var(--fg);font-weight:600}
#tabs > button.on svg{stroke:var(--accent)}
#tabs > button .ext{margin-left:auto;font-size:11px;color:var(--muted)}

.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.sstat{background:#151D27;border:1px solid var(--border);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.sstat .r{display:flex;align-items:flex-start;gap:8px}
.sstat .dot{flex:none;margin:4px 0 0}
#relaylbl,#simlbl{color:#B4C0CF;line-height:1.35}
#bRelay{align-self:flex-start}
#bQuit{width:100%;justify-content:center;border-color:#4A2A2E!important;color:#F2A3A3!important;background:transparent!important}
#bQuit:hover{background:rgba(229,72,77,.12)!important}
#bDiscord,#bDiscordLfv{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 10px;padding:8px 10px;border-radius:12px;border:1px solid rgba(88,101,242,.55);
  background:linear-gradient(180deg,rgba(88,101,242,.22),rgba(88,101,242,.10));color:#E6E9FF;cursor:pointer;text-align:left;font-family:inherit}
#bDiscordLfv{border-color:rgba(245,183,49,.5);background:linear-gradient(180deg,rgba(245,183,49,.16),rgba(245,183,49,.06));color:#FFF3D6}
#bDiscordLfv small{font-size:11px;color:#E9CF94}#bDiscordLfv b{font-size:12.5px;font-weight:650}
#bDiscordLfv:hover{border-color:rgba(245,183,49,.85)}
#bDiscordLfv .dc-logo{flex:none;width:34px;height:34px;display:grid;place-items:center}#bDiscordLfv .dc-logo img{width:34px;height:34px;object-fit:contain;display:block}#bDiscordLfv .dc-t{display:flex;flex-direction:column;min-width:0}
#bDiscord:hover{border-color:rgba(129,140,248,.9);background:linear-gradient(180deg,rgba(88,101,242,.32),rgba(88,101,242,.16))}
#bDiscord .dc-logo{flex:none;width:34px;height:34px;display:grid;place-items:center}#bDiscord .dc-logo svg{display:block}
#bDiscord .dc-t{display:flex;flex-direction:column;min-width:0}#bDiscord b{font-size:12.5px;font-weight:650}#bDiscord small{font-size:11px;color:#AEB4F5}
body.rail #bDiscord,body.rail #bDiscordLfv{justify-content:center;padding:6px 0}body.rail #bDiscord .dc-t,body.rail #bDiscordLfv .dc-t{display:none}

body.rail .sstat .r{justify-content:center}
body.rail #side{width:70px;padding:16px 10px}
body.rail #side .btext,body.rail #tabs > button .lbl,body.rail #tabs > button .ext,body.rail .sstat .t,body.rail #bRelay,body.rail #bQuit .lbl{display:none}
body.rail #side .brand{justify-content:center;padding:0}
body.rail #bRail{align-self:center;margin:0}
body.rail #tabs > button{justify-content:center;padding:8px 0}
#tabs .tsec{font:700 10px "Segoe UI",Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#4B5768;padding:8px 12px 1px;min-height:4px}
body.rail #tabs .tsec{font-size:0;padding:4px 0;border-top:1px solid #1E2733;margin:4px 8px 0;min-height:0}
body.novA #tabs .va-only{display:none}
body.rail .sstat{align-items:center;padding:10px 0}
#content{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{flex:none;display:flex;align-items:center;gap:12px;padding:16px 22px 10px}
#pageTitle{font-size:24px;font-weight:700;letter-spacing:-.01em}
input,select,button{font:inherit;color:var(--fg)}
#banner{display:none}
#flags{display:flex;gap:4px;align-items:center;padding-bottom:6px}
#flags{padding:0;gap:6px}
#flags button{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px;cursor:pointer;line-height:0}
#flags button:hover{border-color:#3A4656}
#flags button.on{border:2px solid var(--accent);padding:4px}
#flags img{width:28px;height:19px;display:block;border-radius:3px}
#flags .tuto{margin-left:6px;background:var(--panel);color:var(--fg);font-weight:600;font-size:13px;line-height:normal;padding:0 16px;height:36px;border:1px solid var(--line);border-radius:999px}
#flags .tuto:hover{background:var(--hover)}
#lock{display:none;flex:none;background:#3A1A1E;border:1px solid #7A2A30;color:#FFB4B4;font-weight:700;text-align:center;padding:10px;margin:0 22px 10px;border-radius:12px}
body.sim #lock{display:block}
main{flex:1;min-height:0;background:transparent;margin:0}
.tab{display:none;height:100%;padding:4px 22px 12px;flex-direction:column;gap:12px;min-height:0}
.tab.on{display:flex}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;background:#1B2531;border:1px solid #33414F;border-radius:999px;padding:0 15px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px;color:var(--fg)}
.btn:hover{background:#243142;border-color:#46566A}
.btn .bi{flex:none;width:24px;height:24px;margin-left:-9px;border-radius:50%;background:#2A3646;display:grid;place-items:center;font-size:11.5px;line-height:1}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn.accent:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.accent .bi{background:var(--ink);color:var(--accent)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{background:var(--danger-hi);border-color:var(--danger-hi)}
.btn.danger .bi{background:rgba(0,0,0,.22)}
.btn:disabled{opacity:.45;cursor:default}
body.sim .lk{opacity:.45;pointer-events:none}
input[type=text]{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 12px;outline:none}
input[type=text]:focus{border-color:var(--accent)}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.muted{color:var(--muted)}
.title{font-size:16px;font-weight:600}
.split{flex:1;min-height:0;display:flex;gap:14px}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;min-height:0;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px}
.stats{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px 16px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.stat span{color:var(--muted);font-size:12.5px}
.stat b{font-size:24px;font-weight:700}
.pane.lib{flex:1.5}
.head{font-size:15.5px;font-weight:700}
select{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:200px;outline:none}
table.fixed{table-layout:fixed}table.fixed td{max-width:none}
.tw{display:inline-block;width:16px;color:var(--muted)}
tr.grp td{font-weight:700}
.soonbtn{opacity:.5}
.btn.warnb{background:rgba(245,181,68,.1);border-color:rgba(245,181,68,.55);color:var(--warn)}
.btn.warnb:hover{background:rgba(245,181,68,.18)}
.btn.warnb .bi{background:var(--warn);color:#0B0F14}
.cc-ours{--cc:var(--cat-ours)}.cc-real{--cc:var(--cat-real)}.cc-ext{--cc:var(--cat-ext)}.cc-off{--cc:var(--cat-off)}.cc-broken{--cc:var(--cat-broken)}.cc-defoff{--cc:var(--cat-defoff)}
tr.citem td{background:var(--cc);cursor:pointer}
tr.citem.cc-broken td{color:#ff9a9a}
tr.citem:hover td{filter:brightness(1.25)}
tr.citem.sel td{background:var(--sel)}
.chip.cc-ours,.chip.cc-real,.chip.cc-ext,.chip.cc-off,.chip.cc-broken,.chip.cc-defoff{background:var(--cc);border-radius:999px;padding:4px 11px;font-size:12px}
.list{flex:1;min-height:0;overflow:auto;background:var(--field);border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:#141B24;color:var(--muted);text-align:left;font-weight:600;font-size:12.5px;padding:9px 10px;z-index:1;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:7px 10px;border-bottom:1px solid #18202A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
tr.item{cursor:pointer}
tr.item:hover td{background:var(--hover)}
tr.item.act td{background:var(--active-row)}
tr.item.act:hover td{background:#173226}
tr.item.chk td{background:var(--sel)}
tr.grp td{background:#151D27;font-weight:600;cursor:pointer;color:#DCE4EE}
tr.grp td .n{color:var(--muted);font-weight:400}
.box{display:inline-block;width:17px;height:17px;border:1.5px solid #5B6778;border-radius:5px;vertical-align:middle;position:relative}
.box.on{background:var(--accent);border-color:var(--accent)}
.box.on::after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:8px;border:solid #0B0F14;border-width:0 2px 2px 0;transform:rotate(45deg)}
.box.part{background:var(--accent);border-color:var(--accent)}
.box.part::after{content:"";position:absolute;left:3px;top:6px;width:8px;height:2px;background:#0B0F14}
.box.act{background:var(--ok);border-color:var(--ok)}
.box.act::after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:8px;border:solid #0B0F14;border-width:0 2px 2px 0;transform:rotate(45deg)}
.box.actpart{background:var(--ok);border-color:var(--ok)}
.box.actpart::after{content:"";position:absolute;left:3px;top:6px;width:8px;height:2px;background:#0B0F14}
/* add-on dans Community et sélectionné (pour le retirer) : case vide, bordée de bleu */
.box.acton{background:transparent;border:2px solid var(--accent)}
#commList table{table-layout:fixed}#commList td{max-width:none}
.st-flight{color:var(--ok)}.st-linked{color:var(--ok)}.st-ext{color:#7cc4ff}.st-real{color:var(--warn)}
.star{color:#f5c542}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:12px;font-weight:600;background:#151D27}
.chip.on{outline:2px solid var(--accent)}
.c-ours td:first-child{border-left:4px solid #2f8f5b}.c-real td:first-child{border-left:4px solid #b88a3a}
.c-ext td:first-child{border-left:4px solid #3a86b8}.c-off td:first-child{border-left:4px solid #7a68b8}
.c-broken td{background:var(--cat-broken)}.c-defoff td:first-child{border-left:4px solid #b8b83a}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
/* Vol SimBrief : sur une petite fenêtre, la page défile au lieu de couper les options */
#tab-vol{overflow-y:auto}
#tab-vol .split{flex:1 0 auto;min-height:300px}
#tab-vol .split > .pane{overflow:visible}
.ticket{display:flex;align-items:center;gap:22px}
.tk-lbl{font-size:11.5px;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.tk-code{font-size:32px;font-weight:700;line-height:1.05}
.tk-name{color:#B4C0CF}

.planline{font:13px Consolas,monospace;color:#B4C0CF;background:var(--field);border:1px solid var(--border);border-radius:10px;padding:9px 12px;white-space:pre-wrap;user-select:text}
.flightlbl:empty{display:none}
.flightlbl{background:#0F2A1F;border:1px solid #1F5A40;color:var(--ok);border-radius:12px;padding:9px 14px;font-weight:600}

#log{flex:1;min-height:120px;overflow:auto;background:var(--field);border:1px solid var(--border);border-radius:12px;padding:8px 10px;font:12.5px Consolas,monospace;white-space:pre-wrap;user-select:text}
.apt-off td{color:var(--off)}.apt-none td{color:var(--warn)}
.form{display:grid;grid-template-columns:max-content 1fr auto auto;gap:8px 10px;align-items:center;max-width:1100px}
.form input[type=text]{width:100%}
#scrDraw{position:relative;width:300px;height:92px;flex:none}.scr{position:absolute;border:2px solid var(--border);background:var(--panel);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:11px}.scr b{font-size:16px}.scr.on{border-color:var(--accent);background:#1b2a44;color:#fff}
input[type=password]{background:var(--field);border:1px solid var(--border);border-radius:6px;padding:6px 8px;outline:none;color:var(--fg)}
/* daltoniens : présent dans Community = bleu ciel ; simplement coché = jaune (palette Okabe-Ito) */body.cb .box.act,body.cb .box.actpart{background:#56B4E9;border-color:#56B4E9}body.cb tr.item.act td{background:#163d55}body.cb tr.item.act:hover td{background:#1d4a66}body.cb .box.on,body.cb .box.part{background:#F0E442;border-color:#F0E442}body.cb .box.on::after{border-color:#1b1f26}body.cb .box.part::after{background:#1b1f26}body.cb .box.acton{background:transparent;border:2px solid #F0E442}body.cb tr.item.chk td{background:#3a4150}
.wn{max-width:620px;font-size:14px;line-height:1.55;color:#DCE6F0}
.wn p{margin:0 0 10px}.wn .wn-h{font-size:16px;color:#FFFFFF;margin-bottom:12px}
.wn ul{margin:0 0 10px 18px;padding:0}.wn li{margin:0 0 5px}
#updBanner{display:none;flex:none;background:#0E2A3A;border:1px solid #1F5E7E;color:#CFEFFF;font-weight:600;padding:8px 10px 8px 14px;align-items:center;gap:10px;margin:0 22px 10px;border-radius:10px}

.mbody .tile{width:250px}
.mbody .list{border-radius:12px}
.plist{max-height:50vh;overflow:auto;background:var(--field);border:1px solid var(--border);border-radius:12px;min-width:380px;padding:4px}.pitem{padding:6px 10px;cursor:pointer;border-radius:8px}.pitem:hover{background:var(--hover)}.pitem.sel{background:rgba(56,189,248,.16);color:#F1F5F9;box-shadow:inset 3px 0 0 var(--accent)}
.mbody fieldset{border:1px solid var(--border);border-radius:14px;margin:0 0 12px;padding:8px 12px 10px;background:#0F151C}
.mbody fieldset legend{padding:0 6px;font-weight:700;color:var(--accent-hi)}
.mbody fieldset label{display:flex;gap:10px;align-items:center;padding:8px 10px;margin:4px 0;border-radius:10px;border:1px solid var(--border);background:#121821}
.mbody fieldset label:hover{border-color:#33404F}
.mbody fieldset label:has(input:checked){border-color:rgba(56,189,248,.6);background:linear-gradient(rgba(56,189,248,.14),rgba(56,189,248,.05))}
.mbody fieldset input[type=radio]{accent-color:var(--accent)}
table.props{border-collapse:separate;border-spacing:0 2px}table.props td{padding:6px 14px 6px 0;border-bottom:1px solid var(--border)}table.props tr:last-child td{border-bottom:0}
.tiles{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.tile{--tc:var(--accent);position:relative;display:inline-flex;flex-direction:column;justify-content:space-between;gap:8px;width:210px;min-height:86px;padding:11px 12px;border-radius:16px;background:#10161E;border:1px solid var(--border);cursor:pointer;text-align:left;box-sizing:border-box}
.tile:hover{border-color:#33404F}
.tiles.fit{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.tiles.fit .tile{width:auto;min-height:78px}
.tile input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.tile::before{content:"";position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:#2A3646}
.tile .ti{flex:none;width:28px;height:28px;border-radius:50%;background:#1E2733;display:grid;place-items:center}
.tile .ti svg{width:15px;height:15px;stroke:#8B98A9}
.tile .tt{font-size:12.5px;font-weight:600;line-height:1.3;color:#B4C0CF;padding-right:12px}
.tile .ts{font-size:10px;font-weight:700;letter-spacing:.06em;color:#5B6778}
.tile .ts::after{content:"OFF"}
.tile.radio .ts::after{content:""}
.tile:has(input:checked){background:linear-gradient(rgba(56,189,248,.14),rgba(56,189,248,.05));border-color:rgba(56,189,248,.55)}
.tile:has(input:checked)::before{background:var(--tc);box-shadow:0 0 8px var(--tc)}
.tile:has(input:checked) .ti{background:var(--tc)}
.tile:has(input:checked) .ti svg{stroke:#0B0F14}
.tile:has(input:checked) .tt{color:#F1F5F9}
.tile:has(input:checked) .ts{color:var(--tc)}
.tile:has(input:checked) .ts::after{content:"ON"}
.tile.radio:has(input:checked) .ts::after{content:"✓"}
.tile:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.tile:has(input:disabled){opacity:.5;cursor:default}
.dform{display:grid;grid-template-columns:max-content minmax(380px,1fr) auto;gap:8px 10px;align-items:center}.dform input[type=text]{width:100%}.dform .span2{grid-column:2 / span 2}
input[type=number]{background:var(--field);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--fg)}
th.c,td.c{text-align:center}
tr.litem{cursor:pointer}tr.litem:hover td{background:var(--hover)}tr.litem.sel td{background:var(--sel)}
.lt-run td{color:var(--ok)}.lt-wait td{color:var(--accent-hi)}.lt-err td{color:#ff9a9a}.lt-off td{color:var(--off)}
fieldset{border:1px solid var(--border);border-radius:8px;margin:8px 0;padding:6px 12px}
legend{color:var(--muted);padding:0 6px}
fieldset label{display:block;padding:3px 0;cursor:pointer}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:#2A3646;border-radius:6px;border:3px solid var(--field)}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>

          "• Library: the folder where you keep your add-ons, outside Community (e.g. D:\\MSFS Addons). Sub-folders by category are fine.\n• To start, with the simulator closed, move to the library ONLY the add-ons you installed yourself (unzipped), shown as \"Real folder\" in the Community list. Leave in Community what an installer manages (PMDG, GSX, Navigraph, Orbx, iniBuilds, FlyByWire…). Then protect (★ Protect) the ones that must always be loaded.\n• Airport sceneries are recognised by their ICAO code (folder name, title, BGL files). If a scenery isn't recognised, select it then \"ICAO codes…\" to enter its codes.\n• Links must be made before starting the simulator: it only reads Community at startup."],

// ---------------------------------------------------------------- échanges avec le C#
const pending = {}; let seq = 0;
function call(cmd, args){
  return new Promise((resolve, reject) => {
    const id = ++seq; pending[id] = {resolve, reject};
    window.chrome.webview.postMessage({id, cmd, args: args || {}});
  });
}
window.chrome.webview.addEventListener("message", ev => {
  const m = ev.data;
  if (m && m.id !== undefined && pending[m.id]) {
    const p = pending[m.id]; delete pending[m.id];
    if (m.ok) p.resolve(m.data); else p.reject(new Error(m.error));
  } else if (m && m.event) onEvent(m.event, m.data);
});
async function run(cmd, args){
  try { return await call(cmd, args); }
  catch (e) { await alertBox(e.message); return undefined; }
}

function modal(text, buttons, bodyNode){
  return new Promise(resolve => {
    const ov = document.createElement("div"); ov.className = "modal";
    const box = document.createElement("div"); box.className = "mbox" + (bodyNode ? " has-body" : ""); ov.appendChild(box);
    const tx = document.createElement("div"); tx.className = "mtext"; tx.textContent = text || ""; if (!text) tx.style.display = "none"; box.appendChild(tx);
    if (bodyNode && text && text.includes("\n")) { const k = text.indexOf("\n"); tx.textContent = text.slice(0, k); const sub = document.createElement("div"); sub.className = "msub"; sub.textContent = text.slice(k + 1).trim(); tx.appendChild(sub); }
    if (bodyNode) { const b = document.createElement("div"); b.className = "mbody"; b.appendChild(bodyNode); box.appendChild(b); }
    const bt = document.createElement("div"); bt.className = "mbtns"; box.appendChild(bt);
    buttons.forEach(b => {
      const el = document.createElement("button"); el.className = "btn" + (b.cls ? " " + b.cls : ""); el.textContent = b.label;
      el.onclick = async () => { if (b.check && !(await b.check())) return; ov.remove(); resolve(b.value); };
      bt.appendChild(el);
    });
    document.body.appendChild(ov);
    const inp = box.querySelector("input[type=text]"); if (inp) setTimeout(() => inp.focus(), 30);
  });
}
const alertBox = text => modal(text, [{label: t("ok"), value: true, cls: "accent"}]);

  return r === "ok" ? inp.value : null;
}

function buildTree(list){
  const root = {name: "", path: "", kids: new Map(), items: []};
  list.forEach(p => {
    let node = root;
    if (p.group) {
      let acc = "";
      p.group.split(/[\\\/]/).forEach(part => {
        acc = acc ? acc + "\\" + part : part;
        if (!node.kids.has(part.toLowerCase())) node.kids.set(part.toLowerCase(), {name: part, path: acc, kids: new Map(), items: []});
        node = node.kids.get(part.toLowerCase());
      });
    }
    node.items.push(p);
  });
  return root;
}

function findNode(node, path){
  if (node.path === path) return node;
  for (const k of node.kids.values()) { const r = findNode(k, path); if (r) return r; }
  return null;
}

function renderLib(){

  const scroll = list.scrollTop, searching = !!$("search").value.trim();
  TREE = buildTree(visible());
  let h = "<table class='fixed'><colgroup><col><col style='width:24%'><col style='width:70px'><col style='width:72px'><col style='width:74px'><col style='width:100px'><col style='width:92px'></colgroup>" +
          "<thead><tr><th>" + esc(t("colName")) + "</th><th>" + esc(t("colTitle")) + "</th><th>" + esc(t("colType")) + "</th><th>" + esc(t("colVer")) +
          "</th><th>ICAO</th><th>" + esc(t("colPin")) + "</th><th>Community</th></tr></thead><tbody>";
  const rowItem = (p, depth) => {
    const on = isOn(p), ck = checked.has(p.path);
    return '<tr class="item' + (ck ? " chk" : on ? " act" : "") + '" data-p="' + esc(p.path) + '"><td style="padding-left:' + (10 + depth * 20) + 'px" title="' + esc(p.path) + '">' +
      '<span class="tw"></span>' + boxHtml(ck ? (on ? "acton" : 2) : (on ? "act" : 0)) + " " + esc(p.name) + "</td><td>" + esc(p.title) + "</td><td>" + esc(TYPE_TITLE(p.type)) +
      "</td><td>" + esc(p.version) + "</td><td>" + esc(p.icao.join(", ")) + (p.icaoManual ? " ✎" : "") + "</td><td class='star'>" + (p.pinned ? "★" : "") +
      "</td><td class='st-" + esc(p.status) + "'>" + esc(t("st" + p.status)) + "</td></tr>";
  };
  const walk = (node, depth) => {
    [...node.kids.values()].sort((a, b) => a.name.localeCompare(b.name, undefined, {sensitivity: "base"})).forEach(k => {
      const all = leaves(k), nChk = all.filter(p => checked.has(p.path)).length, nAct = all.filter(isOn).length;
      const nChkAct = all.filter(p => checked.has(p.path) && isOn(p)).length;
      const st = nChk ? (nChk === all.length ? (nChkAct === nChk ? "acton" : 2) : 1) : (nAct && nAct === all.length ? "act" : nAct ? "actpart" : 0);
      const open = searching || opened.has(k.path);
      h += '<tr class="grp" data-g="' + esc(k.path) + '"><td colspan="7" style="padding-left:' + (10 + depth * 20) + 'px"><span class="tw">' + (open ? "▾" : "▸") +
           '</span><span data-gbox="1">' + boxHtml(st) + "</span> " + esc(k.name) + " (" + nAct + " / " + all.length + ")</td></tr>";
      if (open) walk(k, depth + 1);
    });
    node.items.forEach(p => { h += rowItem(p, depth); });
  };
  walk(TREE, 0);

function selTable(cols, rows, opts){

  opts = opts || {};

function fillSettings(s){

  $("sLib").value = s.library || ""; $("sComm").value = s.community || ""; $("sUser") && ($("sUser").value = s.simbrief_user || "");

  $("sMsfs").value = s.msfs_launch || ""; $("sSimc").value = s.simconnect_dir || "";
  $("optAlt").checked = !!s.include_alternates; $("optAuto").checked = !!s.auto_unlink;
  if (s.relay_auto !== undefined) $("optRelay").checked = !!s.relay_auto;
  if (s.flight_only !== undefined) $("optOnly").checked = !!s.flight_only;
  $("sStartup").checked = !!s.startup; $("sStartupAdmin").checked = !!s.startup_admin;
  $("adminMode").textContent = t(s.is_admin ? "modeAdmin" : "modeNormal"); $("bRestartAdmin").style.display = s.is_admin ? "none" : "";
  $("sVa").value = s.fshub_va || ""; document.body.classList.toggle("novA", !s.fshub_va); $("sKey").value = s.fshub_token || ""; $("sCb").checked = !!s.colorblind; $("sUpd").checked = s.update_check !== false;
  if (!window.__wnDone && s.whatsnew_seen !== "{{VERSION}}") { window.__wnDone = true; setTimeout(showWhatsNew, 1200); }   /* une fois après chaque mise à jour */
  document.body.classList.toggle("cb", !!s.colorblind);

function dirty(){ const d = SAVED_FIELDS.some(id => $(id).value !== savedVals[id]); $("saveLbl").textContent = d ? t("unsaved") : ""; return d; }

let SCREENS = [];
async function loadScreens(){
  try { SCREENS = await call("screens"); } catch (e) { SCREENS = []; }
  const cur = SETTINGS.screen || "auto";
  const opts = [["auto", t("lfScrAuto")]].concat(SCREENS.map(m => [m.dev, m.label]));
  if (!opts.some(o => o[0] === cur)) opts.push([cur, t("lfScrGone")]);
  $("sScreen").innerHTML = opts.map(o => '<option value="' + esc(o[0]) + '">' + esc(o[1]) + "</option>").join(""); $("sScreen").value = cur;
  drawScreens();
}
function drawScreens(){
  const box = $("scrDraw");
  if (!SCREENS.length) { box.innerHTML = '<span class="muted">' + esc(t("scrNone")) + "</span>"; return; }
  const x0 = Math.min(...SCREENS.map(m => m.x)), y0 = Math.min(...SCREENS.map(m => m.y));
  const x1 = Math.max(...SCREENS.map(m => m.x + m.w)), y1 = Math.max(...SCREENS.map(m => m.y + m.h));
  const k = Math.min(290 / Math.max(1, x1 - x0), 86 / Math.max(1, y1 - y0));
  const cur = SETTINGS.screen || "auto";
  const target = cur === "auto" ? (SCREENS.find(m => !m.primary) || SCREENS[0]) : (SCREENS.find(m => m.dev === cur) || SCREENS[0]);
  box.innerHTML = SCREENS.map(m => { const on = target && m.dev === target.dev;
    return '<div class="scr' + (on ? " on" : "") + '" style="left:' + (4 + (m.x - x0) * k) + "px;top:" + (3 + (m.y - y0) * k) + "px;width:" + (m.w * k - 4) + "px;height:" + (m.h * k - 4) +
      'px"><b>' + m.num + "</b><small>" + (m.primary ? "MSFS" : on ? "Hangar FS 2024" : "") + "</small></div>"; }).join("");
}

/* « Quoi de neuf » : écrit pour chaque version, dans le ton de l'annonce Discord (une ligne = un paragraphe) */
const WHATSNEW = { fr: "✈️ <b>Bienvenue dans la version {{VERSION}} !</b>\n🧭 <b>Page Plan de vol plus claire</b> : deux colonnes, le FMS en trois étapes (avion, départ, arrivée ou durée) et les options repliées avec un résumé de tes choix.\n🗺️ <b>Destination choisie</b> : aperçu du trajet, distance, temps de vol et export SimBrief / .PLN, juste sous la liste.\n✈️ <b>Plan VFR</b> : trace ton vol à ta façon en cliquant où tu veux, avec VOR, DME, NDB, axes de piste, et même les RNAV, ILS, SID, STAR et approches de ton MSFS (importés une fois), puis export SimBrief ou .PLN (entrée Plan VFR du menu).\n📂 <b>Menu en rubriques</b> sur toutes les pages : Add-ons, Préparer, Voler, Radars, avec la carte Plan de vol personnel et les radars FSHub.\n🌅 Et toujours le <b>moment du vol</b> (matin, journée, crépuscule, nuit) et le jour / la nuit en direct, arrivés avec la 12.8.", en: "✈️ <b>Welcome to version {{VERSION}}!</b>\n🧭 <b>Clearer Flight plan page</b>: two columns, the FMS in three steps (aircraft, departure, arrival or duration) and folded options with a summary of your choices.\n🗺️ <b>Chosen destination</b>: route preview, distance, flight time and SimBrief / .PLN export, right under the list.\n✈️ <b>VFR plan</b>: draw your flight your own way by clicking anywhere, with VOR, DME, NDB, runway axes, and even your MSFS RNAV, ILS, SID, STAR and approaches (imported once), then SimBrief or .PLN export (VFR plan menu entry).\n📂 <b>Menu in sections</b> on every page: Add-ons, Prepare, Fly, Radars, with the Personal flight plan map and the FSHub radars.\n🌅 And still the <b>time of flight</b> (morning, day, dusk, night) and live day / night, which came with 12.8." };
function wnNode(html){
  const d = document.createElement("div"); d.className = "wn";
  html.split("\n").filter(x => x.trim()).forEach((l, i) => { const p = document.createElement("p"); if (i === 0) p.className = "wn-h"; p.innerHTML = l; d.appendChild(p); });
  return d;
}
/* texte de la page de version GitHub (Markdown simple) : partie française, ou anglaise après la ligne --- */
function mdNode(md){
  const parts = String(md || "").split(/\n-{3,}\n/), txt = (LANG === "en" && parts[1]) ? parts[1] : parts[0];
  const esc = x => x.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"})[c]);
  const fmt = x => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
  const d = document.createElement("div"); d.className = "wn"; let ul = null;
  txt.split("\n").forEach(l => {
    if (/^\s*[-*] /.test(l)) { if (!ul) { ul = document.createElement("ul"); d.appendChild(ul); } const li = document.createElement("li"); li.innerHTML = fmt(l.replace(/^\s*[-*] /, "")); ul.appendChild(li); return; }
    ul = null; if (!l.trim()) return;
    const p = document.createElement("p"); if (/^#+ /.test(l)) { p.className = "wn-h"; l = l.replace(/^#+ /, ""); } p.innerHTML = fmt(l); d.appendChild(p);
  });
  return d;
}

function onEvent(ev, data){
  if (ev === "nav") { if (data && data.tab) showTab(data.tab); return; }
  if (ev === "update") {
    if (data.available) showUpd(data.available);
    else if (data.error) { $("updBanner").classList.remove("busy"); alertBox(t("updFail") + "\n" + data.error); }
    else { $("updText").textContent = data.text + " " + data.progress + " %"; $("updBar").firstChild.style.width = data.progress + "%"; }
    return;
  }
  if (ev === "log") {
    const l = $("log"); const atEnd = l.scrollTop + l.clientHeight >= l.scrollHeight - 4;
    l.textContent += (l.textContent ? "\n" : "") + data;
    if (atEnd) l.scrollTop = l.scrollHeight;
  } else if (ev === "status") $("status").textContent = data;
  else if (ev === "sim") setSim(data);
  else if (ev === "launcher") loadLauncher();
  else if (ev === "relay") setRelay(data);
  else if (ev === "changed") { loadLibrary(); if (currentTab === "vol") refreshFlight(); }
}
